<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Random Dice Practice</title>
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; touch-action: none; margin: 0; padding: 0; }
        body { background: #181c2b; color: #fff; font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; overflow: hidden; }

        /* 상단 디버그 메뉴 */
        #debug-panel {
            width: 100%; max-width: 420px; background: #232838; padding: 8px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; font-size: 11px; z-index: 10;
        }
        .dbg-btn { background: #353b50; border: 1px solid #4a526d; color: #fff; padding: 6px 2px; border-radius: 6px; font-weight: bold; cursor: pointer; text-align: center; }
        .dbg-btn:active { background: #4f587a; }

        /* 메인 캔버스 영역 */
        #canvas-container { position: relative; width: 100%; max-width: 420px; }
        canvas { background: #81c7f5; display: block; width: 100%; border-radius: 4px; }

        /* 하단 주사위 강화 메뉴 */
        #powerup-panel {
            width: 100%; max-width: 420px; background: #1e2230; padding: 10px 6px; display: flex; justify-content: space-around; gap: 4px; z-index: 10;
        }
        .dice-up-btn {
            background: #2a3044; border: 2px solid #3d4560; border-radius: 8px; width: 18%; padding: 6px 2px; display: flex; flex-direction: column; align-items: center; cursor: pointer;
        }
        .dice-up-btn .d-icon { width: 28px; height: 28px; border-radius: 6px; margin-bottom: 4px; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: bold; }
        .dice-up-btn .d-lvl { font-size: 10px; color: #aaa; }
        .dice-up-btn .d-cost { font-size: 11px; color: #ffd700; font-weight: bold; margin-top: 2px; }
    </style>
</head>
<body>

    <!-- 디버그 패널 (이미지 상단 컨트롤) -->
    <div id="debug-panel">
        <div class="dbg-btn" onclick="addSP(10000)">💎 +10000</div>
        <div class="dbg-btn" id="god-btn" onclick="toggleGod()">무적 OFF</div>
        <div class="dbg-btn" onclick="toggleSpeed()">⏩ x<span id="speed-txt">1</span></div>
        <div class="dbg-btn" onclick="clearBoard()">🗑️ 필드 초기화</div>
    </div>

    <div id="canvas-container">
        <canvas id="gameCanvas"></canvas>
    </div>

    <!-- 하단 파워업 패널 -->
    <div id="powerup-panel" id="powerupBtns"></div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        const width = Math.min(window.innerWidth, 420);
        const height = Math.min(window.innerHeight - 130, 580);
        canvas.width = width;
        canvas.height = height;

        // 게임 변수
        let hp = 3;
        let wave = 1;
        let sp = 100;
        let spawnCost = 10;
        let isGod = false;
        let gameSpeed = 1;

        // 덱 구성 주사위 5종 (이미지 속 덱 느낌 반영)
        const DECK = [
            { id: 0, name: '가시', color: '#2ed573', lvl: 1, cost: 100, baseDmg: 20 },
            { id: 1, name: '조커', color: '#a4b0be', lvl: 1, cost: 100, baseDmg: 10 },
            { id: 2, name: '달', color: '#70a1ff', lvl: 1, cost: 100, baseDmg: 15 },
            { id: 3, name: '유전', color: '#ff6b81', lvl: 1, cost: 100, baseDmg: 25 },
            { id: 4, name: '콤보', color: '#57606f', lvl: 1, cost: 100, baseDmg: 30 }
        ];

        // 3x5 주사위 필드 그리드
        const gridRows = 3;
        const gridCols = 5;
        const tileSize = Math.floor((width - 40) / 5);
        const boardX = (width - (tileSize * gridCols)) / 2;
        const boardY = height - (tileSize * gridRows) - 80;
        let board = Array(gridRows * gridCols).fill(null);

        // 몬스터 트랙 (상단 순환 라인)
        const waypoints = [
            { x: 30, y: 80 },
            { x: width - 30, y: 80 },
            { x: width - 30, y: boardY - 20 },
            { x: 30, y: boardY - 20 }
        ];

        let monsters = [];
        let projectiles = [];

        // 드래그 관련 변수
        let dragIdx = null;
        let dragX = 0, dragY = 0;

        // --- 파워업 UI 생성 ---
        function initPowerupUI() {
            const panel = document.getElementById('powerup-panel');
            panel.innerHTML = '';
            DECK.forEach((d, i) => {
                const btn = document.createElement('div');
                btn.className = 'dice-up-btn';
                btn.onclick = () => upgradeDice(i);
                btn.innerHTML = `
                    <div class="d-icon" style="background:${d.color}">${d.name}</div>
                    <div class="d-lvl" id="lvl-${i}">LV.${d.lvl}</div>
                    <div class="d-cost" id="cost-${i}">💎 ${d.cost}</div>
                `;
                panel.appendChild(btn);
            });
        }

        function upgradeDice(idx) {
            const d = DECK[idx];
            if (sp >= d.cost) {
                sp -= d.cost;
                d.lvl++;
                d.cost += 100;
                document.getElementById(`lvl-${idx}`).innerText = `LV.${d.lvl}`;
                document.getElementById(`cost-${idx}`).innerText = `💎 ${d.cost}`;
            }
        }

        // 디버그 함수들
        function addSP(amt) { sp += amt; }
        function toggleGod() {
            isGod = !isGod;
            document.getElementById('god-btn').innerText = isGod ? "무적 ON" : "무적 OFF";
        }
        function toggleSpeed() {
            gameSpeed = gameSpeed === 1 ? 2 : 1;
            document.getElementById('speed-txt').innerText = gameSpeed;
        }
        function clearBoard() { board.fill(null); }

        // --- 주사위 소환 ---
        function spawnDice() {
            if (sp < spawnCost) return;
            let emptySlots = [];
            board.forEach((v, i) => { if (v === null) emptySlots.push(i); });
            if (emptySlots.length === 0) return;

            sp -= spawnCost;
            spawnCost += 10;

            const slot = emptySlots[Math.floor(Math.random() * emptySlots.length)];
            const diceType = DECK[Math.floor(Math.random() * DECK.length)];

            board[slot] = {
                deckIdx: diceType.id,
                dot: 1,
                cooldown: 0
            };
        }

        // --- 터치 / 드래그 이벤트 ---
        function getSlotIndex(x, y) {
            for (let r = 0; r < gridRows; r++) {
                for (let c = 0; c < gridCols; c++) {
                    const sx = boardX + c * tileSize;
                    const sy = boardY + r * tileSize;
                    if (x >= sx && x <= sx + tileSize && y >= sy && y <= sy + tileSize) {
                        return r * gridCols + c;
                    }
                }
            }
            return null;
        }

        canvas.addEventListener('pointerdown', e => {
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            // 소환 버튼 클릭 체크 (중앙 버튼)
            const btnX = width / 2;
            const btnY = boardY + gridRows * tileSize + 40;
            if (Math.hypot(x - btnX, y - btnY) < 30) {
                spawnDice();
                return;
            }

            const idx = getSlotIndex(x, y);
            if (idx !== null && board[idx]) {
                dragIdx = idx;
                dragX = x; dragY = y;
            }
        });

        canvas.addEventListener('pointermove', e => {
            if (dragIdx === null) return;
            const rect = canvas.getBoundingClientRect();
            dragX = e.clientX - rect.left;
            dragY = e.clientY - rect.top;
        });

        canvas.addEventListener('pointerup', e => {
            if (dragIdx === null) return;
            const rect = canvas.getBoundingClientRect();
            const targetIdx = getSlotIndex(e.clientX - rect.left, e.clientY - rect.top);

            if (targetIdx !== null && targetIdx !== dragIdx && board[targetIdx]) {
                const src = board[dragIdx];
                const dst = board[targetIdx];

                // 같은 눈금끼리 합성 (랜덤 주사위 변환)
                if (src.dot === dst.dot) {
                    const randomType = DECK[Math.floor(Math.random() * DECK.length)];
                    board[targetIdx] = {
                        deckIdx: randomType.id,
                        dot: src.dot + 1,
                        cooldown: 0
                    };
                    board[dragIdx] = null;
                }
            }
            dragIdx = null;
        });

        // --- 루프 & 업데이트 ---
        let spawnTimer = 0;
        function update() {
            // 몬스터 생성
            spawnTimer += gameSpeed;
            if (spawnTimer > 80) {
                spawnTimer = 0;
                monsters.push({
                    x: waypoints[0].x, y: waypoints[0].y,
                    wp: 1, hp: 100 + wave * 80, maxHp: 100 + wave * 80, speed: 1.5
                });
            }

            // 몬스터 이동
            for (let i = monsters.length - 1; i >= 0; i--) {
                const m = monsters[i];
                const target = waypoints[m.wp];
                const dx = target.x - m.x, dy = target.y - m.y;
                const dist = Math.hypot(dx, dy);

                if (dist < m.speed * gameSpeed) {
                    m.wp = (m.wp + 1) % waypoints.length;
                    if (m.wp === 1) { // 한 바퀴 돌았음
                        if (!isGod) hp--;
                        monsters.splice(i, 1);
                        continue;
                    }
                } else {
                    m.x += (dx / dist) * m.speed * gameSpeed;
                    m.y += (dy / dist) * m.speed * gameSpeed;
                }
            }

            // 주사위 공격
            board.forEach((dice, idx) => {
                if (!dice) return;
                dice.cooldown -= gameSpeed;
                if (dice.cooldown <= 0 && monsters.length > 0) {
                    const r = Math.floor(idx / gridCols), c = idx % gridCols;
                    const sx = boardX + c * tileSize + tileSize / 2;
                    const sy = boardY + r * tileSize + tileSize / 2;
                    const dInfo = DECK[dice.deckIdx];

                    projectiles.push({
                        x: sx, y: sy, target: monsters[0],
                        dmg: (dInfo.baseDmg + (dInfo.lvl - 1) * 10) * dice.dot,
                        color: dInfo.color
                    });
                    dice.cooldown = 35;
                }
            });

            // 투사체 이동
            for (let i = projectiles.length - 1; i >= 0; i--) {
                const p = projectiles[i];
                if (!p.target || p.target.hp <= 0) { projectiles.splice(i, 1); continue; }
                const dx = p.target.x - p.x, dy = p.target.y - p.y;
                const dist = Math.hypot(dx, dy);

                if (dist < 10) {
                    p.target.hp -= p.dmg;
                    if (p.target.hp <= 0) {
                        const mIdx = monsters.indexOf(p.target);
                        if (mIdx !== -1) monsters.splice(mIdx, 1);
                        sp += 10;
                    }
                    projectiles.splice(i, 1);
                } else {
                    p.x += (dx / dist) * 12 * gameSpeed;
                    p.y += (dy / dist) * 12 * gameSpeed;
                }
            }
        }

        // --- 렌더링 ---
        function render() {
            ctx.clearRect(0, 0, width, height);

            // 1. 상단 정보 (WAVE / 하트)
            ctx.fillStyle = '#1e2230';
            ctx.fillRect(0, 0, width, 45);
            ctx.fillStyle = '#fff';
            ctx.font = 'bold 16px Arial';
            ctx.fillText(`WAVE ${wave}`, 20, 28);
            ctx.fillText(`❤️ ${hp}`, width - 70, 28);

            // 2. 몬스터 트랙
            ctx.strokeStyle = 'rgba(255,255,255,0.4)';
            ctx.lineWidth = 14;
            ctx.lineJoin = 'round';
            ctx.beginPath();
            ctx.moveTo(waypoints[0].x, waypoints[0].y);
            waypoints.forEach(wp => ctx.lineTo(wp.x, wp.y));
            ctx.closePath();
            ctx.stroke();

            // 3. 몬스터
            monsters.forEach(m => {
                ctx.fillStyle = '#e74c3c';
                ctx.beginPath(); ctx.arc(m.x, m.y, 10, 0, Math.PI * 2); ctx.fill();
                // HP 바
                ctx.fillStyle = '#000'; ctx.fillRect(m.x - 12, m.y - 16, 24, 4);
                ctx.fillStyle = '#2ecc71'; ctx.fillRect(m.x - 12, m.y - 16, Math.max(0, (m.hp / m.maxHp) * 24), 4);
            });

            // 4. 투사체
            projectiles.forEach(p => {
                ctx.fillStyle = p.color;
                ctx.beginPath(); ctx.arc(p.x, p.y, 4, 0, Math.PI * 2); ctx.fill();
            });

            // 5. 3x5 주사위 판
            for (let r = 0; r < gridRows; r++) {
                for (let c = 0; c < gridCols; c++) {
                    const idx = r * gridCols + c;
                    const sx = boardX + c * tileSize;
                    const sy = boardY + r * tileSize;

                    ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
                    ctx.fillRect(sx + 2, sy + 2, tileSize - 4, tileSize - 4);

                    const dice = board[idx];
                    if (dice && idx !== dragIdx) {
                        drawDice(sx + tileSize / 2, sy + tileSize / 2, dice);
                    }
                }
            }

            // 드래그 중인 주사위
            if (dragIdx !== null && board[dragIdx]) {
                drawDice(dragX, dragY, board[dragIdx]);
            }

            // 6. 하단 소환 버튼 및 SP
            const btnX = width / 2;
            const btnY = boardY + gridRows * tileSize + 40;

            ctx.fillStyle = '#202433';
            ctx.beginPath(); ctx.arc(btnX, btnY, 28, 0, Math.PI * 2); ctx.fill();
            ctx.strokeStyle = '#3d4560'; ctx.lineWidth = 3; ctx.stroke();

            ctx.fillStyle = '#fff';
            ctx.font = 'bold 12px Arial';
            ctx.textAlign = 'center';
            ctx.fillText(`🎲 ${spawnCost}`, btnX, btnY + 4);

            // SP 표시
            ctx.fillStyle = '#2ed573';
            ctx.font = 'bold 14px Arial';
            ctx.fillText(`💎 ${sp}`, btnX - 80, btnY + 4);
            ctx.textAlign = 'left';
        }

        function drawDice(cx, cy, dice) {
            const size = tileSize - 10;
            const dInfo = DECK[dice.deckIdx];

            ctx.fillStyle = dInfo.color;
            ctx.beginPath();
            ctx.roundRect(cx - size / 2, cy - size / 2, size, size, 8);
            ctx.fill();

            // 눈금 표시
            ctx.fillStyle = '#fff';
            ctx.font = 'bold 12px Arial';
            ctx.textAlign = 'center';
            ctx.fillText(`● ${dice.dot}`, cx, cy + 4);
            ctx.textAlign = 'left';
        }

        function gameLoop() {
            update();
            render();
            requestAnimationFrame(gameLoop);
        }

        initPowerupUI();
        gameLoop();
    </script>
</body>
</html>
