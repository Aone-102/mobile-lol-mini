<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <title>모바일 LOL: 하이퍼 어택 Ultra (WebRTC Multi)</title>
    <!-- PeerJS CDN 추가 -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
            margin: 0; padding: 0;
        }
        body {
            background-color: #0b0e14;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            min-height: 100vh; overflow: hidden;
        }
        #top-ui {
            display: flex; justify-content: space-between; align-items: center;
            width: 100%; max-width: 480px; padding: 8px 12px;
            background-color: rgba(22, 26, 35, 0.95);
            backdrop-filter: blur(5px); font-size: 12px; font-weight: bold;
            border-bottom: 2px solid #333; position: fixed; top: 0; z-index: 10;
        }
        .ui-group { display: flex; gap: 8px; align-items: center; }
        .hp-bar-container {
            width: 70px; height: 14px; background-color: #333;
            border: 1px solid #555; border-radius: 7px;
            overflow: hidden; position: relative;
        }
        .hp-bar-fill { height: 100%; transition: width 0.1s linear; }
        .hp-player { background-color: #3498db; width: 100%; }
        .hp-tower { background-color: #e74c3c; width: 100%; }
        .hp-bar-text {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            font-size: 9px; text-align: center; line-height: 14px;
            color: #fff; font-weight: bold; text-shadow: 0 0 2px #000;
        }

        #dev-panel {
            display: none; position: fixed; top: 38px; z-index: 15;
            background: rgba(142, 68, 173, 0.9); padding: 4px 8px;
            border-radius: 0 0 8px 8px; gap: 6px; align-items: center;
        }
        .btn-dev {
            background: #27ae60; color: #fff; border: none; padding: 3px 8px;
            border-radius: 4px; font-weight: bold; font-size: 11px; cursor: pointer;
        }

        canvas {
            background-color: #12181b;
            box-shadow: 0 4px 20px rgba(0,0,0,0.8);
            margin-top: 36px;
        }

        #chat-container {
            position: absolute; bottom: 80px; left: 10px; width: 220px;
            background: rgba(0, 0, 0, 0.6); border-radius: 6px;
            padding: 6px; display: flex; flex-direction: column; gap: 4px; z-index: 20;
        }
        #chat-logs {
            height: 70px; overflow-y: auto; font-size: 11px;
            display: flex; flex-direction: column; gap: 2px;
        }
        .chat-msg { color: #ddd; word-break: break-all; }
        .chat-sys { color: #f1c40f; font-weight: bold; }
        #chat-input-box { display: flex; gap: 4px; }
        #chat-input {
            flex: 1; background: rgba(255,255,255,0.1); border: 1px solid #555;
            color: #fff; border-radius: 3px; padding: 2px 5px; font-size: 11px;
        }

        #controls-overlay {
            position: absolute; bottom: 15px; right: 10px;
            display: flex; gap: 6px; z-index: 10;
        }
        #menu-overlay {
            position: absolute; bottom: 15px; left: 240px;
            display: flex; gap: 6px; z-index: 10;
        }
        .btn-ui {
            width: 46px; height: 46px; border-radius: 50%;
            border: 2px solid #f39c12; background: rgba(44, 62, 80, 0.9);
            color: #fff; font-weight: bold; font-size: 11px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            cursor: pointer;
        }
        .btn-ui:active { transform: scale(0.92); }
        .btn-stat { border-color: #3498db; }
        .btn-shop { border-color: #2ecc71; }
        .btn-multi { border-color: #9b59b6; }
        .btn-skill-cd { font-size: 8px; color: #f1c40f; margin-top: 2px; }

        .modal {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 90%; max-width: 400px; max-height: 85vh;
            overflow-y: auto; background: rgba(22, 26, 35, 0.98);
            border: 2px solid #f39c12; border-radius: 12px; padding: 16px;
            display: none; flex-direction: column; gap: 10px; z-index: 100;
        }
        .modal-title { font-size: 16px; font-weight: bold; text-align: center; color: #f39c12; border-bottom: 1px solid #444; padding-bottom: 6px; }
        .modal-content { font-size: 12px; line-height: 1.5; }
        .shop-section-title { font-size: 12px; color: #f1c40f; font-weight: bold; margin: 8px 0 4px 0; border-left: 3px solid #f1c40f; padding-left: 6px; }
        .shop-item { display: flex; justify-content: space-between; align-items: center; background: rgba(255,255,255,0.05); padding: 6px 8px; border-radius: 6px; margin-bottom: 4px; }
        .btn-buy { background: #2ecc71; color: #fff; border: none; padding: 4px 8px; border-radius: 4px; font-weight: bold; font-size: 10px; cursor: pointer; }
        .btn-bought { background: #7f8c8d !important; cursor: not-allowed; }
        .btn-close { background: #e74c3c; color: #fff; border: none; padding: 6px; border-radius: 6px; font-weight: bold; margin-top: 5px; cursor: pointer; }
    </style>
</head>
<body>

    <div id="top-ui">
        <div class="ui-group">
            <div>🚩 R<span id="round">1</span></div>
            <div>💰 <span id="gold">0</span>G</div>
        </div>
        <div class="ui-group">
            <span>👤</span>
            <div class="hp-bar-container">
                <div class="hp-bar-fill hp-player" id="playerHpBar"></div>
                <div class="hp-bar-text" id="playerHpText">200 / 200</div>
            </div>
            <span>🏰</span>
            <div class="hp-bar-container">
                <div class="hp-bar-fill hp-tower" id="towerHpBar"></div>
                <div class="hp-bar-text" id="towerHpText">1500 / 1500</div>
            </div>
        </div>
    </div>

    <div id="dev-panel">
        <button class="btn-dev" onclick="addDevGold()">+10,000G</button>
        <button class="btn-dev" onclick="toggleGameSpeed()">배속: <span id="speed-label">1x</span></button>
    </div>

    <canvas id="gameCanvas"></canvas>

    <div id="chat-container">
        <div id="chat-logs">
            <div class="chat-msg chat-sys">[시스템] 게임에 접속했습니다.</div>
        </div>
        <div id="chat-input-box">
            <input type="text" id="chat-input" placeholder="메시지 입력..." onkeypress="handleChatKey(event)">
        </div>
    </div>

    <div id="menu-overlay">
        <button class="btn-ui btn-stat" id="btnOpenStat">스탯</button>
        <button class="btn-ui btn-shop" id="btnOpenShop">상점</button>
        <button class="btn-ui btn-multi" id="btnOpenMulti">멀티</button>
    </div>

    <div id="controls-overlay">
        <button class="btn-ui" id="btnQ">Q<span class="btn-skill-cd" id="cdQ">READY</span></button>
        <button class="btn-ui" id="btnW">W<span class="btn-skill-cd" id="cdW">READY</span></button>
        <button class="btn-ui" id="btnE">E<span class="btn-skill-cd" id="cdE">READY</span></button>
    </div>

    <!-- 스탯 모달 -->
    <div class="modal" id="modalStat">
        <div class="modal-title">챔피언 스탯</div>
        <div class="modal-content" id="statContent"></div>
        <button class="btn-close" onclick="closeModal('modalStat')">닫기</button>
    </div>

    <!-- 상점 모달 -->
    <div class="modal" id="modalShop">
        <div class="modal-title">아이템 상점</div>
        <div class="modal-content" id="shopContent"></div>
        <button class="btn-close" onclick="closeModal('modalShop')">닫기</button>
    </div>

    <!-- 멀티 모달 -->
    <div class="modal" id="modalMulti">
        <div class="modal-title">실시간 P2P 멀티플레이</div>
        <div class="modal-content">
            <p style="margin-bottom:8px; color:#aaa;">다른 창이나 기기에서 동일한 방 코드로 접속하세요.</p>
            <button class="btn-buy" style="width:100%; margin-bottom:8px;" onclick="createMultiRoom()">방 생성 (Host)</button>
            <div style="display:flex; gap:4px;">
                <input type="text" id="roomCodeInput" placeholder="4자리 방 코드" style="flex:1; background:#222; border:1px solid #555; color:#fff; padding:4px;">
                <button class="btn-buy" onclick="joinMultiRoom()">참가</button>
            </div>
            <p id="multiStatus" style="color:#f1c40f; margin-top:8px; word-break:break-all;"></p>
        </div>
        <button class="btn-close" onclick="closeModal('modalMulti')">닫기</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        const canvasWidth = Math.min(window.innerWidth, 480);
        const canvasHeight = Math.min(window.innerHeight - 36, 640);
        canvas.width = canvasWidth;
        canvas.height = canvasHeight;

        const midLineY = canvasHeight * 0.45;

        let gold = 0;
        let round = 1;
        let isGameOver = false;
        let gameSpeed = 1;
        let isDevMode = false;

        let roundBannerTimer = 0;
        let roundBannerText = "";

        // WebRTC P2P 변수
        let peer = null;
        let peerConn = null;
        let isMultiActive = false;
        let remotePlayer = null; // 상대방 위치 정보

        const player = {
            x: canvasWidth / 2, y: canvasHeight - 120,
            targetX: canvasWidth / 2, targetY: canvasHeight - 120,
            radius: 18, moveSpeed: 3.8,
            hp: 200, maxHp: 200,
            attackPower: 30, attackBaseCooldown: 15, attackCooldown: 0,
            attackRange: 170,
            qBuffTimer: 0, qCooldown: 0,
            wBuffTimer: 0, wCooldown: 0,
            eCooldown: 0,
            lifesteal: 0,
            scopeChance: 0.25,
            explosionChance: 0
        };

        const tower = {
            x: canvasWidth / 2, y: canvasHeight - 40,
            radius: 30, hp: 1500, maxHp: 1500
        };

        const statUpgrades = {
            atk: { level: 0, basePrice: 50, priceMult: 1.4 },
            spd: { level: 0, basePrice: 70, priceMult: 1.5 }
        };

        const equipmentItems = [
            { id: 'doran', name: '🗡️ 도란의 검', desc: '공격력 +15, 체력 +40', price: 150, bought: false, apply: () => { player.attackPower += 15; player.maxHp += 40; player.hp += 40; } },
            { id: 'boots', name: '👟 광전사의 신발', desc: '이속 +0.8, 공속 +15%', price: 220, bought: false, apply: () => { player.moveSpeed += 0.8; player.attackBaseCooldown = Math.max(3, Math.floor(player.attackBaseCooldown * 0.85)); } },
            { id: 'vamp', name: '🩸 흡혈의 낫', desc: '타격 시 체력 +4 회복', price: 280, bought: false, apply: () => { player.lifesteal += 4; } },
            { id: 'expOrb', name: '💥 폭발의 구슬', desc: '30% 확률 탄환 폭발', price: 300, bought: false, apply: () => { player.explosionChance += 0.3; } },
            { id: 'warmog', name: '🛡️ 워모그의 갑옷', desc: '체력 +150 & 타워 +300', price: 350, bought: false, apply: () => { player.maxHp += 150; player.hp += 150; tower.maxHp += 300; tower.hp = Math.min(tower.maxHp, tower.hp + 300); } }
        ];

        let minions = [];
        let projectiles = [];
        let floatingTexts = [];
        let explosions = [];
        let scopeEffects = [];
        let shockwaves = [];

        // 채팅 및 메시지 핸들러
        function handleChatKey(e) {
            if (e.key === 'Enter') {
                const input = document.getElementById('chat-input');
                const val = input.value.trim();
                if (!val) return;

                addChatLog(`나: ${val}`);
                if (peerConn && peerConn.open) {
                    peerConn.send({ type: 'CHAT', msg: val });
                }

                if (val === "개발자모드") {
                    const code = prompt("코드를 입력하라:");
                    if (code === "물게피스") {
                        isDevMode = true;
                        document.getElementById('dev-panel').style.display = 'flex';
                        addChatLog("[시스템] 개발자 모드가 활성화되었습니다!", true);
                    } else {
                        addChatLog("[시스템] 잘못된 코드입니다.", true);
                    }
                }
                input.value = '';
            }
        }

        function addChatLog(msg, isSys = false) {
            const logs = document.getElementById('chat-logs');
            const div = document.createElement('div');
            div.className = isSys ? 'chat-msg chat-sys' : 'chat-msg';
            div.innerText = msg;
            logs.appendChild(div);
            logs.scrollTop = logs.scrollHeight;
        }

        function addDevGold() {
            gold += 10000;
            updateUI();
            addChatLog("[개발자] 10,000 Gold가 지급되었습니다.", true);
        }

        function toggleGameSpeed() {
            if (gameSpeed === 1) gameSpeed = 2;
            else if (gameSpeed === 2) gameSpeed = 3;
            else gameSpeed = 1;
            document.getElementById('speed-label').innerText = `${gameSpeed}x`;
            addChatLog(`[개발자] 배속이 ${gameSpeed}x 설정되었습니다.`, true);
        }

        function updateUI() {
            document.getElementById('gold').innerText = gold;
            document.getElementById('round').innerText = round;

            document.getElementById('playerHpBar').style.width = Math.max(0, (player.hp / player.maxHp) * 100) + '%';
            document.getElementById('playerHpText').innerText = `${Math.ceil(Math.max(0, player.hp))} / ${player.maxHp}`;

            document.getElementById('towerHpBar').style.width = Math.max(0, (tower.hp / tower.maxHp) * 100) + '%';
            document.getElementById('towerHpText').innerText = `${Math.ceil(Math.max(0, tower.hp))} / ${tower.maxHp}`;

            document.getElementById('cdQ').innerText = player.qCooldown > 0 ? `${Math.ceil(player.qCooldown / 60)}s` : 'READY';
            document.getElementById('cdW').innerText = player.wCooldown > 0 ? `${Math.ceil(player.wCooldown / 60)}s` : 'READY';
            document.getElementById('cdE').innerText = player.eCooldown > 0 ? `${Math.ceil(player.eCooldown / 60)}s` : 'READY';
        }

        function renderShop() {
            const atkPrice = Math.floor(statUpgrades.atk.basePrice * Math.pow(statUpgrades.atk.priceMult, statUpgrades.atk.level));
            const spdPrice = Math.floor(statUpgrades.spd.basePrice * Math.pow(statUpgrades.spd.priceMult, statUpgrades.spd.level));

            let html = `
                <div class="shop-section-title">⚡ 스탯 강화</div>
                <div class="shop-item"><div><b>공격력 +10</b> (Lv.${statUpgrades.atk.level})<br><small style="color:#aaa">${atkPrice}G</small></div><button class="btn-buy" onclick="buyStatUpgrade('atk')">구매</button></div>
                <div class="shop-item"><div><b>공속 +10%</b> (Lv.${statUpgrades.spd.level})<br><small style="color:#aaa">${spdPrice}G</small></div><button class="btn-buy" onclick="buyStatUpgrade('spd')">구매</button></div>
                <div class="shop-section-title">🗡️ 장비 아이템</div>
            `;
            equipmentItems.forEach((item, idx) => {
                html += `<div class="shop-item"><div><b>${item.name}</b><br><small style="color:#aaa">${item.desc} / ${item.price}G</small></div>
                ${item.bought ? `<button class="btn-buy btn-bought" disabled>완료</button>` : `<button class="btn-buy" onclick="buyEquipment(${idx})">구매</button>`}</div>`;
            });
            document.getElementById('shopContent').innerHTML = html;
        }

        function buyStatUpgrade(type) {
            const stat = statUpgrades[type];
            const price = Math.floor(stat.basePrice * Math.pow(stat.priceMult, stat.level));
            if (gold >= price) {
                gold -= price;
                if (type === 'atk') player.attackPower += 10;
                else player.attackBaseCooldown = Math.max(3, Math.floor(player.attackBaseCooldown * 0.9));
                stat.level++;
                updateUI(); renderShop();
            }
        }

        function buyEquipment(idx) {
            const item = equipmentItems[idx];
            if (!item.bought && gold >= item.price) {
                gold -= item.price; item.bought = true; item.apply();
                updateUI(); renderShop();
            }
        }

        canvas.addEventListener('pointerdown', (e) => {
            if (isGameOver) return;
            const rect = canvas.getBoundingClientRect();
            player.targetX = e.clientX - rect.left;
            player.targetY = e.clientY - rect.top;
        });

        document.getElementById('btnQ').addEventListener('pointerdown', (e) => { e.stopPropagation(); if (player.qCooldown <= 0) { player.qBuffTimer = 180; player.qCooldown = 360; } });
        document.getElementById('btnW').addEventListener('pointerdown', (e) => { e.stopPropagation(); if (player.wCooldown <= 0) { player.wBuffTimer = 150; player.wCooldown = 420; } });
        document.getElementById('btnE').addEventListener('pointerdown', (e) => {
            e.stopPropagation();
            if (player.eCooldown <= 0) {
                player.eCooldown = 500;
                shockwaves.push({ x: player.x, y: player.y, radius: 10, maxRadius: 160, alpha: 1.0 });
                minions.forEach(m => {
                    if (Math.hypot(m.x - player.x, m.y - player.y) <= 160) {
                        const dmg = Math.floor(player.attackPower * 2.5);
                        m.hp -= dmg;
                        floatingTexts.push(new FloatingText(`-${dmg}`, m.x, m.y - 15, '#f1c40f'));
                    }
                });
            }
        });

        document.getElementById('btnOpenStat').addEventListener('pointerdown', (e) => {
            e.stopPropagation();
            document.getElementById('statContent').innerHTML = `
                • 체력: <b>${player.hp} / ${player.maxHp}</b><br>
                • 공격력: <b>${player.attackPower}</b><br>
                • 조준경 확률: <b>${Math.round(player.scopeChance * 100)}%</b><br>
                • 폭발 확률: <b>${Math.round(player.explosionChance * 100)}%</b>
            `;
            document.getElementById('modalStat').style.display = 'flex';
        });

        document.getElementById('btnOpenShop').addEventListener('pointerdown', (e) => { e.stopPropagation(); renderShop(); document.getElementById('modalShop').style.display = 'flex'; });
        document.getElementById('btnOpenMulti').addEventListener('pointerdown', (e) => { e.stopPropagation(); document.getElementById('modalMulti').style.display = 'flex'; });
        
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }

        // ================= WebRTC 멀티플레이 로직 =================
        function initPeer(customId = null) {
            if (peer) peer.destroy();
            peer = customId ? new Peer(customId) : new Peer();

            peer.on('open', (id) => {
                document.getElementById('multiStatus').innerText = `내 ID: ${id}\n연결 대기 중...`;
            });

            peer.on('connection', (conn) => {
                peerConn = conn;
                setupConnection();
            });

            peer.on('error', (err) => {
                document.getElementById('multiStatus').innerText = `오류 발생: ${err.type}`;
            });
        }

        function createMultiRoom() {
            const code = "room-" + Math.floor(1000 + Math.random() * 9000);
            initPeer(code);
            document.getElementById('multiStatus').innerText = `방 생성 완료!\n코드: ${code}`;
        }

        function joinMultiRoom() {
            const inputVal = document.getElementById('roomCodeInput').value.trim();
            const targetId = inputVal.startsWith('room-') ? inputVal : 'room-' + inputVal;
            if (!peer) initPeer();

            setTimeout(() => {
                peerConn = peer.connect(targetId);
                setupConnection();
            }, 500);
        }

        function setupConnection() {
            peerConn.on('open', () => {
                isMultiActive = true;
                remotePlayer = { x: canvasWidth / 2 + 30, y: canvasHeight - 120, hp: 200, maxHp: 200 };
                document.getElementById('multiStatus').innerText = "상대방과 성공적으로 동기화 되었습니다!";
                addChatLog("[멀티] 플레이어가 게임에 접속했습니다.", true);
                closeModal('modalMulti');
            });

            peerConn.on('data', (data) => {
                if (data.type === 'POS') {
                    if (!remotePlayer) remotePlayer = {};
                    remotePlayer.x = data.x;
                    remotePlayer.y = data.y;
                    remotePlayer.hp = data.hp;
                    remotePlayer.maxHp = data.maxHp;
                } else if (data.type === 'CHAT') {
                    addChatLog(`상대: ${data.msg}`);
                } else if (data.type === 'SHOOT') {
                    // 상대방 사격 시 시각적 투사체 생성
                    projectiles.push({
                        x: data.x, y: data.y, target: minions[data.targetIdx] || { x: data.tx, y: data.ty, hp: 10 },
                        speed: 12, damage: data.damage, color: '#9b59b6', radius: 5
                    });
                }
            });

            peerConn.on('close', () => {
                isMultiActive = false;
                remotePlayer = null;
                addChatLog("[멀티] 상대방과의 연결이 끊겼습니다.", true);
            });
        }

        class FloatingText {
            constructor(text, x, y, color = '#ffda79') { this.text = text; this.x = x; this.y = y; this.color = color; this.alpha = 1; }
            update() { this.y -= 1.2; this.alpha -= 0.03; }
            draw() {
                ctx.save(); ctx.globalAlpha = Math.max(0, this.alpha);
                ctx.font = 'bold 12px Arial'; ctx.fillStyle = this.color;
                ctx.fillText(this.text, this.x, this.y); ctx.restore();
            }
        }

        let isWaveActive = false;

        function triggerRoundBanner(roundNum) {
            roundBannerText = `ROUND ${roundNum}`;
            roundBannerTimer = 90;
        }

        function startNextWave() {
            isWaveActive = true;
            triggerRoundBanner(round);
            addChatLog(`[라운드] ROUND ${round} 시작!`, true);

            let enemyCount = 5 + round * 2;
            let spawned = 0;

            const spawnInterval = setInterval(() => {
                if (isGameOver) { clearInterval(spawnInterval); return; }
                const isChaser = Math.random() < 0.35;
                minions.push({
                    x: Math.random() * (canvasWidth - 80) + 40, y: -20,
                    radius: isChaser ? 15 : 13, speed: 0.9 + round * 0.1,
                    hp: 100 + round * 35, maxHp: 100 + round * 35,
                    isChaser: isChaser, isBoss: false,
                    attackPower: Math.floor(player.attackPower * 0.4), attackCooldown: 0, attackRate: 90
                });
                spawned++;
                if (spawned >= enemyCount) {
                    clearInterval(spawnInterval);
                    setTimeout(() => {
                        minions.push({
                            x: canvasWidth / 2, y: -30, radius: 24,
                            speed: 0.5 + round * 0.05, hp: 450 + round * 320, maxHp: 450 + round * 320,
                            isChaser: false, isBoss: true, attackPower: 30, attackCooldown: 0, attackRate: 60
                        });
                    }, 1000);
                }
            }, 600 / gameSpeed);
        }

        function gameLoop() {
            if (isGameOver) return;

            for (let loop = 0; loop < gameSpeed; loop++) {
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                ctx.strokeStyle = 'rgba(255, 255, 255, 0.08)';
                ctx.beginPath(); ctx.moveTo(0, midLineY); ctx.lineTo(canvasWidth, midLineY); ctx.stroke();

                if (!isWaveActive && minions.length === 0) startNextWave();

                if (player.qCooldown > 0) player.qCooldown--;
                if (player.wCooldown > 0) player.wCooldown--;
                if (player.eCooldown > 0) player.eCooldown--;

                let currentSpeed = player.moveSpeed * (player.wBuffTimer > 0 ? 1.8 : 1);
                if (player.wBuffTimer > 0) player.wBuffTimer--;

                const dx = player.targetX - player.x;
                const dy = player.targetY - player.y;
                const dist = Math.hypot(dx, dy);
                if (dist > 2) {
                    player.x += (dx / dist) * currentSpeed;
                    player.y += (dy / dist) * currentSpeed;
                }

                // 멀티 데이터 전송 (내 위치 공유)
                if (isMultiActive && peerConn && peerConn.open) {
                    peerConn.send({
                        type: 'POS',
                        x: player.x,
                        y: player.y,
                        hp: player.hp,
                        maxHp: player.maxHp
                    });
                }

                let currentCooldown = player.attackBaseCooldown;
                if (player.qBuffTimer > 0) {
                    currentCooldown = Math.max(1, Math.floor(player.attackBaseCooldown * 0.1));
                    player.qBuffTimer--;
                }

                if (player.attackCooldown > 0) player.attackCooldown--;
                if (player.attackCooldown === 0) {
                    let targets = minions.filter(m => Math.hypot(m.x - player.x, m.y - player.y) <= player.attackRange)
                                         .sort((a, b) => Math.hypot(a.x - player.x, a.y - player.y) - Math.hypot(b.x - player.x, b.y - player.y));

                    if (targets.length > 0) {
                        const targetIdx = minions.indexOf(targets[0]);
                        projectiles.push({
                            x: player.x, y: player.y, target: targets[0], speed: 12,
                            damage: player.attackPower, color: '#2ecc71', radius: 5
                        });

                        // 멀티 사격 동기화
                        if (isMultiActive && peerConn && peerConn.open) {
                            peerConn.send({
                                type: 'SHOOT', x: player.x, y: player.y,
                                targetIdx: targetIdx, tx: targets[0].x, ty: targets[0].y,
                                damage: player.attackPower
                            });
                        }

                        // 조준경 발동 이펙트
                        if (Math.random() < player.scopeChance) {
                            const scopeTarget = targets.length > 1 ? targets[1] : targets[0];
                            projectiles.push({
                                x: player.x, y: player.y, target: scopeTarget, speed: 15,
                                damage: Math.floor(player.attackPower * 0.8), color: '#a55eea', radius: 4
                            });
                            scopeEffects.push({ progress: 0, maxTime: 42 });
                        }
                        player.attackCooldown = currentCooldown;
                    }
                }

                // 내 플레이어 그리기
                ctx.save();
                if (player.qBuffTimer > 0) {
                    ctx.strokeStyle = '#f1c40f'; ctx.lineWidth = 4;
                    ctx.beginPath(); ctx.arc(player.x, player.y, player.radius + 4, 0, Math.PI * 2); ctx.stroke();
                }
                if (player.wBuffTimer > 0) {
                    ctx.strokeStyle = '#3498db'; ctx.lineWidth = 3;
                    ctx.beginPath(); ctx.arc(player.x, player.y, player.radius + 7, 0, Math.PI * 2); ctx.stroke();
                }
                ctx.fillStyle = '#3498db'; ctx.beginPath(); ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2); ctx.fill();
                ctx.restore();

                // 🟣 [실시간 멀티 플레이어 동료 렌더링]
                if (isMultiActive && remotePlayer) {
                    ctx.save();
                    ctx.fillStyle = '#9b59b6'; // 보라색 2P
                    ctx.beginPath(); ctx.arc(remotePlayer.x, remotePlayer.y, player.radius, 0, Math.PI * 2); ctx.fill();

                    // 2P 머리 위 닉네임 및 HP
                    ctx.font = 'bold 10px Arial';
                    ctx.fillStyle = '#e056fd';
                    ctx.textAlign = 'center';
                    ctx.fillText("PLAYER 2", remotePlayer.x, remotePlayer.y - player.radius - 8);
                    ctx.restore();
                }

                // 타워
                ctx.fillStyle = '#e74c3c'; ctx.beginPath(); ctx.arc(tower.x, tower.y, tower.radius, 0, Math.PI * 2); ctx.fill();

                // 조준경 이펙트
                for (let i = scopeEffects.length - 1; i >= 0; i--) {
                    const sc = scopeEffects[i];
                    sc.progress += 1;
                    const scale = (sc.progress / sc.maxTime);
                    const curRadius = 10 + scale * 30;
                    const alpha = 1 - scale;

                    ctx.save();
                    ctx.strokeStyle = `rgba(165, 94, 234, ${alpha})`;
                    ctx.lineWidth = 2;

                    ctx.beginPath(); ctx.arc(player.x, player.y, curRadius, 0, Math.PI * 2); ctx.stroke();

                    const innerGap = 4 + scale * 4;
                    const outerLen = curRadius + 6;

                    ctx.beginPath();
                    ctx.moveTo(player.x, player.y - innerGap); ctx.lineTo(player.x, player.y - outerLen);
                    ctx.moveTo(player.x, player.y + innerGap); ctx.lineTo(player.x, player.y + outerLen);
                    ctx.moveTo(player.x - innerGap, player.y); ctx.lineTo(player.x - outerLen, player.y);
                    ctx.moveTo(player.x + innerGap, player.y); ctx.lineTo(player.x + outerLen, player.y);
                    ctx.stroke();

                    ctx.restore();
                    if (sc.progress >= sc.maxTime) scopeEffects.splice(i, 1);
                }

                // 충격파 스킬(E)
                for (let i = shockwaves.length - 1; i >= 0; i--) {
                    const sw = shockwaves[i];
                    sw.radius += 8;
                    sw.alpha -= 0.05;
                    ctx.save();
                    ctx.strokeStyle = `rgba(241, 196, 15, ${sw.alpha})`;
                    ctx.lineWidth = 4;
                    ctx.beginPath(); ctx.arc(sw.x, sw.y, sw.radius, 0, Math.PI * 2); ctx.stroke();
                    ctx.restore();
                    if (sw.alpha <= 0) shockwaves.splice(i, 1);
                }

                // 미니언 & 체력바
                for (let i = minions.length - 1; i >= 0; i--) {
                    const m = minions[i];
                    if (m.isChaser) {
                        const d = Math.hypot(player.x - m.x, player.y - m.y);
                        if (d > player.radius + m.radius) {
                            m.x += ((player.x - m.x) / d) * m.speed; m.y += ((player.y - m.y) / d) * m.speed;
                        } else if (m.attackCooldown-- <= 0) {
                            player.hp -= m.attackPower; m.attackCooldown = m.attackRate;
                        }
                    } else {
                        if (m.y < midLineY) m.y += m.speed;
                        else {
                            const d = Math.hypot(tower.x - m.x, tower.y - m.y);
                            if (d > tower.radius + m.radius) {
                                m.x += ((tower.x - m.x) / d) * m.speed; m.y += ((tower.y - m.y) / d) * m.speed;
                            } else if (m.attackCooldown-- <= 0) {
                                tower.hp -= m.isBoss ? 40 : 15; m.attackCooldown = m.attackRate;
                            }
                        }
                    }

                    ctx.fillStyle = m.isBoss ? '#8e44ad' : (m.isChaser ? '#e67e22' : '#e74c3c');
                    ctx.beginPath(); ctx.arc(m.x, m.y, m.radius, 0, Math.PI * 2); ctx.fill();

                    const hpBarW = 36;
                    const hpBarH = 6;
                    const hpBarX = m.x - hpBarW / 2;
                    const hpBarY = m.y - m.radius - 16;

                    ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
                    ctx.fillRect(hpBarX, hpBarY, hpBarW, hpBarH);

                    const currentHpW = Math.max(0, (m.hp / m.maxHp) * hpBarW);
                    ctx.fillStyle = '#2ecc71';
                    ctx.fillRect(hpBarX, hpBarY, currentHpW, hpBarH);

                    ctx.strokeStyle = '#000'; ctx.lineWidth = 1;
                    ctx.strokeRect(hpBarX, hpBarY, hpBarW, hpBarH);

                    ctx.font = 'bold 9px Arial';
                    ctx.fillStyle = '#ffffff';
                    ctx.textAlign = 'center';
                    ctx.fillText(`${Math.ceil(Math.max(0, m.hp))}/${Math.ceil(m.maxHp)}`, m.x, hpBarY - 2);

                    if (m.hp <= 0) {
                        gold += m.isBoss ? 100 : 15; minions.splice(i, 1);
                        if (minions.length === 0) { isWaveActive = false; round++; }
                    }
                }

                // 투사체
                for (let i = projectiles.length - 1; i >= 0; i--) {
                    const p = projectiles[i];
                    if (!p.target || p.target.hp <= 0) { projectiles.splice(i, 1); continue; }
                    const d = Math.hypot(p.target.x - p.x, p.target.y - p.y);
                    if (d < p.speed) {
                        p.target.hp -= p.damage;
                        if (player.lifesteal > 0) player.hp = Math.min(player.maxHp, player.hp + player.lifesteal);

                        floatingTexts.push(new FloatingText(`-${p.damage}`, p.target.x, p.target.y - 10, p.color));

                        if (player.explosionChance > 0 && Math.random() < player.explosionChance) {
                            explosions.push({ x: p.target.x, y: p.target.y, radius: 50, timer: 12 });
                            minions.forEach(nearM => {
                                if (nearM !== p.target && Math.hypot(nearM.x - p.target.x, nearM.y - p.target.y) <= 50) {
                                    nearM.hp -= Math.floor(p.damage * 0.7);
                                }
                            });
                        }
                        projectiles.splice(i, 1);
                    } else {
                        p.x += ((p.target.x - p.x) / d) * p.speed; p.y += ((p.target.y - p.y) / d) * p.speed;
                        ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2); ctx.fill();
                    }
                }

                // 폭발 및 텍스트 애니메이션
                for (let i = explosions.length - 1; i >= 0; i--) {
                    const exp = explosions[i];
                    ctx.fillStyle = `rgba(230, 126, 34, ${exp.timer / 12 * 0.6})`;
                    ctx.beginPath(); ctx.arc(exp.x, exp.y, exp.radius, 0, Math.PI * 2); ctx.fill();
                    if (--exp.timer <= 0) explosions.splice(i, 1);
                }

                for (let i = floatingTexts.length - 1; i >= 0; i--) {
                    floatingTexts[i].update(); floatingTexts[i].draw();
                    if (floatingTexts[i].alpha <= 0) floatingTexts.splice(i, 1);
                }
            }

            // 라운드 배너
            if (roundBannerTimer > 0) {
                ctx.save();
                const alpha = Math.min(1, roundBannerTimer / 30);
                ctx.globalAlpha = alpha;
                ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
                ctx.fillRect(0, canvasHeight / 2 - 35, canvasWidth, 70);

                ctx.font = 'bold 28px Arial';
                ctx.fillStyle = '#f1c40f';
                ctx.textAlign = 'center';
                ctx.shadowColor = '#e67e22';
                ctx.shadowBlur = 10;
                ctx.fillText(roundBannerText, canvasWidth / 2, canvasHeight / 2 + 10);
                ctx.restore();
                roundBannerTimer--;
            }

            updateUI();
            requestAnimationFrame(gameLoop);
        }

        updateUI();
        gameLoop();
    </script>
</body>
</html>
