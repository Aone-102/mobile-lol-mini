<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <title>모바일 LOL: 하이퍼 어택 Pro</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #0b0e14;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        #top-ui {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 480px;
            padding: 8px 12px;
            background-color: rgba(22, 26, 35, 0.95);
            backdrop-filter: blur(5px);
            font-size: 13px;
            font-weight: bold;
            border-bottom: 2px solid #333;
            position: fixed;
            top: 0;
            z-index: 10;
        }
        .ui-group {
            display: flex;
            gap: 10px;
        }
        .hp-bar-container {
            width: 90px;
            height: 16px;
            background-color: #333;
            border: 1px solid #555;
            border-radius: 8px;
            overflow: hidden;
            position: relative;
        }
        .hp-bar-fill {
            height: 100%;
            background-color: #e74c3c;
            width: 100%;
            transition: width 0.1s linear;
        }
        .hp-bar-text {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            font-size: 10px; text-align: center; line-height: 16px;
            color: #fff; font-weight: bold; text-shadow: 0 0 2px #000;
        }
        canvas {
            background-color: #12181b;
            box-shadow: 0 4px 20px rgba(0,0,0,0.8);
            margin-top: 40px;
        }
        /* 우하단 컨트롤 */
        #controls-overlay {
            position: absolute;
            bottom: 20px;
            right: 15px;
            display: flex;
            gap: 10px;
            z-index: 10;
        }
        /* 좌하단 메뉴 (스탯 & 상점) */
        #menu-overlay {
            position: absolute;
            bottom: 20px;
            left: 15px;
            display: flex;
            gap: 10px;
            z-index: 10;
        }
        .btn-ui {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            border: 2px solid #f39c12;
            background: rgba(44, 62, 80, 0.9);
            color: #fff;
            font-weight: bold;
            font-size: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 8px rgba(0,0,0,0.5);
        }
        .btn-ui:active { transform: scale(0.92); }
        .btn-stat { border-color: #3498db; }
        .btn-shop { border-color: #2ecc71; }

        /* 모달 팝업 창 (스탯 & 상점) */
        .modal {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 85%;
            max-width: 380px;
            background: rgba(22, 26, 35, 0.95);
            border: 2px solid #f39c12;
            border-radius: 12px;
            padding: 18px;
            display: none;
            flex-direction: column;
            gap: 12px;
            z-index: 100;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
        }
        .modal-title {
            font-size: 18px;
            font-weight: bold;
            text-align: center;
            color: #f39c12;
            border-bottom: 1px solid #444;
            padding-bottom: 8px;
        }
        .modal-content {
            font-size: 14px;
            line-height: 1.6;
        }
        .shop-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255,255,255,0.05);
            padding: 8px 10px;
            border-radius: 6px;
            margin-bottom: 6px;
        }
        .btn-buy {
            background: #2ecc71;
            color: #fff;
            border: none;
            padding: 5px 10px;
            border-radius: 4px;
            font-weight: bold;
        }
        .btn-close {
            background: #e74c3c;
            color: #fff;
            border: none;
            padding: 8px;
            border-radius: 6px;
            font-weight: bold;
            margin-top: 5px;
        }
        #game-msg {
            position: absolute;
            top: 40%; left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.85);
            padding: 20px;
            border-radius: 10px;
            font-size: 22px;
            font-weight: bold;
            color: #e74c3c;
            display: none;
            z-index: 200;
            text-align: center;
        }
    </style>
</head>
<body>

    <!-- 상단 UI 영역 -->
    <div id="top-ui">
        <div class="ui-group">
            <div>🚩 R<span id="round">1</span></div>
            <div>💰 <span id="gold">0</span>G</div>
        </div>
        <!-- 타워 HP 게이지 + 숫자 -->
        <div class="ui-group" style="align-items: center;">
            <span style="font-size:11px;">🏰</span>
            <div class="hp-bar-container">
                <div class="hp-bar-fill" id="towerHpBar"></div>
                <div class="hp-bar-text" id="towerHpText">1500 / 1500</div>
            </div>
        </div>
    </div>

    <canvas id="gameCanvas"></canvas>
    <div id="game-msg">게임 오버!</div>

    <!-- 좌하단 메뉴 버튼 -->
    <div id="menu-overlay">
        <button class="btn-ui btn-stat" id="btnOpenStat">스탯</button>
        <button class="btn-ui btn-shop" id="btnOpenShop">상점</button>
    </div>

    <!-- 우하단 스킬 버튼 -->
    <div id="controls-overlay">
        <button class="btn-ui" id="btnQ">Q<br><span style="font-size:9px">난사</span></button>
    </div>

    <!-- 스탯 모달 팝업 -->
    <div class="modal" id="modalStat">
        <div class="modal-title">챔피언 스탯</div>
        <div class="modal-content" id="statContent"></div>
        <button class="btn-close" onclick="closeModal('modalStat')">닫기</button>
    </div>

    <!-- 상점 모달 팝업 -->
    <div class="modal" id="modalShop">
        <div class="modal-title">아이템 상점</div>
        <div class="modal-content">
            <div class="shop-item">
                <div>공격력 +10<br><small style="color:#aaa">가격: 50 Gold</small></div>
                <button class="btn-buy" onclick="buyUpgrade('atk')">구매</button>
            </div>
            <div class="shop-item">
                <div>공격속도 +10%<br><small style="color:#aaa">가격: 70 Gold</small></div>
                <button class="btn-buy" onclick="buyUpgrade('spd')">구매</button>
            </div>
            <div class="shop-item">
                <div>타워 체력 +300 회복<br><small style="color:#aaa">가격: 40 Gold</small></div>
                <button class="btn-buy" onclick="buyUpgrade('heal')">구매</button>
            </div>
        </div>
        <button class="btn-close" onclick="closeModal('modalShop')">닫기</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Canvas 크기
        const canvasWidth = Math.min(window.innerWidth, 480);
        const canvasHeight = Math.min(window.innerHeight - 40, 640);
        canvas.width = canvasWidth;
        canvas.height = canvasHeight;

        // 게임 제어 변수
        let gold = 0;
        let round = 1;
        let isGameOver = false;

        // 플레이어 스탯
        const player = {
            x: canvasWidth / 2,
            y: canvasHeight - 120,
            targetX: canvasWidth / 2,
            targetY: canvasHeight - 120,
            radius: 18,
            moveSpeed: 3.8,
            attackPower: 30,
            attackBaseCooldown: 15, // 프레임 단위 (낮을수록 빠름)
            attackCooldown: 0,
            attackRange: 170,
            qBuffTimer: 0
        };

        // 아군 타워
        const tower = {
            x: canvasWidth / 2,
            y: canvasHeight - 40,
            radius: 30,
            hp: 1500,
            maxHp: 1500
        };

        // 객체 및 이펙트 관리 배열
        let minions = [];
        let projectiles = [];
        let floatingTexts = []; // 데미지 표기 텍스트
        let particles = [];

        // UI 요소 업데이트
        function updateUI() {
            document.getElementById('gold').innerText = gold;
            document.getElementById('round').innerText = round;

            // 타워 HP 게이지 & 숫자 표기
            const hpPercent = Math.max(0, (tower.hp / tower.maxHp) * 100);
            document.getElementById('towerHpBar').style.width = hpPercent + '%';
            document.getElementById('towerHpText').innerText = `${Math.ceil(Math.max(0, tower.hp))} / ${tower.maxHp}`;
        }

        // ==========================================
        // 조작 & 스킬
        // ==========================================
        canvas.addEventListener('pointerdown', (e) => {
            if (isGameOver) return;
            const rect = canvas.getBoundingClientRect();
            player.targetX = e.clientX - rect.left;
            player.targetY = e.clientY - rect.top;
        });

        document.getElementById('btnQ').addEventListener('pointerdown', (e) => {
            e.stopPropagation();
            if (player.qBuffTimer > 0 || isGameOver) return;
            player.qBuffTimer = 180; // 3초간 지속
        });

        // ==========================================
        // 모달 / 스탯 / 상점 로직
        // ==========================================
        document.getElementById('btnOpenStat').addEventListener('pointerdown', (e) => {
            e.stopPropagation();
            const content = `
                • 공격력: <b>${player.attackPower}</b><br>
                • 기본 공속: <b>초당 ${(60 / player.attackBaseCooldown).toFixed(1)}회</b><br>
                • 공격 사거리: <b>${player.attackRange}</b><br>
                • 이동 속도: <b>${player.moveSpeed}</b>
            `;
            document.getElementById('statContent').innerHTML = content;
            document.getElementById('modalStat').style.display = 'flex';
        });

        document.getElementById('btnOpenShop').addEventListener('pointerdown', (e) => {
            e.stopPropagation();
            document.getElementById('modalShop').style.display = 'flex';
        });

        function closeModal(id) {
            document.getElementById(id).style.display = 'none';
        }

        function buyUpgrade(type) {
            if (type === 'atk' && gold >= 50) {
                gold -= 50; player.attackPower += 10;
            } else if (type === 'spd' && gold >= 70) {
                gold -= 70; player.attackBaseCooldown = Math.max(3, Math.floor(player.attackBaseCooldown * 0.9));
            } else if (type === 'heal' && gold >= 40) {
                gold -= 40; tower.hp = Math.min(tower.maxHp, tower.hp + 300);
            } else {
                alert("골드가 부족합니다!");
            }
            updateUI();
        }

        // ==========================================
        // Floating Text (데미지 연출)
        // ==========================================
        class FloatingText {
            constructor(text, x, y, color = '#ffda79') {
                this.text = text;
                this.x = x + (Math.random() - 0.5) * 15;
                this.y = y;
                this.color = color;
                this.alpha = 1;
                this.life = 30; // 30 프레임 동안 서서히 사라짐
            }
            update() {
                this.y -= 1.2; // 위로 떠오름
                this.alpha -= 1 / 30;
            }
            draw() {
                ctx.save();
                ctx.globalAlpha = Math.max(0, this.alpha);
                ctx.font = 'bold 14px Arial';
                ctx.fillStyle = this.color;
                ctx.fillText(this.text, this.x, this.y);
                ctx.restore();
            }
        }

        // ==========================================
        // 웨이브 / 보스 라운드 로직
        // ==========================================
        let isWaveActive = false;

        function startNextWave() {
            isWaveActive = true;
            let enemyCount = 4 + round * 2;
            let spawned = 0;

            const spawnInterval = setInterval(() => {
                if (isGameOver) { clearInterval(spawnInterval); return; }

                // 일반 몹 생성
                minions.push({
                    x: Math.random() * (canvasWidth - 80) + 40,
                    y: -20, radius: 13,
                    speed: 0.8 + round * 0.1,
                    hp: 100 + round * 40,
                    maxHp: 100 + round * 40,
                    isBoss: false
                });
                spawned++;

                // 마지막 몹 생성 시 보스 몹도 추가! (라운드마다 점점 강해짐)
                if (spawned >= enemyCount) {
                    clearInterval(spawnInterval);
                    setTimeout(() => {
                        minions.push({
                            x: canvasWidth / 2,
                            y: -30, radius: 24, // 보스 크기
                            speed: 0.5 + round * 0.05,
                            hp: 400 + round * 300, // 라운드가 지날수록 비약적 상승
                            maxHp: 400 + round * 300,
                            isBoss: true
                        });
                    }, 1000);
                }
            }, 500);
        }

        // ==========================================
        // 게임 루프
        // ==========================================
        function gameLoop() {
            if (isGameOver) return;
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 라인 배경
            ctx.strokeStyle = '#1e2836'; ctx.lineWidth = 1;
            for (let i = 0; i < canvasWidth; i += 50) { ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, canvasHeight); ctx.stroke(); }

            // 1. 라운드 관리
            if (!isWaveActive && minions.length === 0) {
                startNextWave();
            }

            // 2. 플레이어 이동
            const dx = player.targetX - player.x;
            const dy = player.targetY - player.y;
            const dist = Math.hypot(dx, dy);
            if (dist > 2) {
                player.x += (dx / dist) * player.moveSpeed;
                player.y += (dy / dist) * player.moveSpeed;
            }
            player.x = Math.max(player.radius, Math.min(canvasWidth - player.radius, player.x));
            player.y = Math.max(player.radius + 40, Math.min(canvasHeight - player.radius - 50, player.y));

            // 3. Q버프 & 플레이어 그리기
            let currentCooldown = player.attackBaseCooldown;
            if (player.qBuffTimer > 0) {
                currentCooldown = Math.max(1, Math.floor(player.attackBaseCooldown * 0.05)); // 95% 공속 적용
                player.qBuffTimer--;
                ctx.strokeStyle = `rgba(243, 156, 18, ${Math.abs(Math.sin(player.qBuffTimer * 0.1))})`;
                ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(player.x, player.y, player.radius + 6, 0, Math.PI * 2); ctx.stroke();
            }

            ctx.fillStyle = '#3498db'; ctx.beginPath(); ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2); ctx.fill();
            ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();

            // 사거리 가이드
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.08)'; ctx.beginPath(); ctx.arc(player.x, player.y, player.attackRange, 0, Math.PI * 2); ctx.stroke();

            // 4. 자동 공격 로직
            if (player.attackCooldown > 0) player.attackCooldown--;
            if (player.attackCooldown === 0) {
                let target = null;
                let minDist = player.attackRange;

                minions.forEach(m => {
                    const distToM = Math.hypot(m.x - player.x, m.y - player.y);
                    if (distToM < minDist) { minDist = distToM; target = m; }
                });

                if (target) {
                    projectiles.push({
                        x: player.x, y: player.y, target: target, speed: 12,
                        damage: player.attackPower,
                        color: player.qBuffTimer > 0 ? '#f1c40f' : '#2ecc71',
                        radius: 5
                    });
                    player.attackCooldown = currentCooldown;
                }
            }

            // 5. 타워
            ctx.fillStyle = '#e74c3c'; ctx.beginPath(); ctx.arc(tower.x, tower.y, tower.radius, 0, Math.PI * 2); ctx.fill();

            // 6. 몬스터(미니언/보스) 업데이트 및 HP 표기
            for (let i = minions.length - 1; i >= 0; i--) {
                const m = minions[i];
                const distToTower = Math.hypot(tower.x - m.x, tower.y - m.y);

                if (distToTower > tower.radius + 8) {
                    m.y += m.speed;
                } else {
                    tower.hp -= m.isBoss ? 2 : 0.5; // 보스는 타워에 강한 데미지
                    updateUI();
                    if (tower.hp <= 0) {
                        isGameOver = true;
                        document.getElementById('game-msg').style.display = 'block';
                        return;
                    }
                }

                // 몬스터 외형
                ctx.fillStyle = m.isBoss ? '#9b59b6' : '#e74c3c'; // 보스는 보라색
                ctx.beginPath(); ctx.arc(m.x, m.y, m.radius, 0, Math.PI * 2); ctx.fill();
                ctx.strokeStyle = m.isBoss ? '#f1c40f' : '#000'; ctx.lineWidth = m.isBoss ? 2 : 1; ctx.stroke();

                // 몬스터 HP 게이지 & 수치 표기
                const barWidth = m.radius * 2.2;
                const barHeight = 5;
                ctx.fillStyle = '#333'; ctx.fillRect(m.x - barWidth/2, m.y - m.radius - 12, barWidth, barHeight);
                ctx.fillStyle = '#2ecc71'; ctx.fillRect(m.x - barWidth/2, m.y - m.radius - 12, (m.hp / m.maxHp) * barWidth, barHeight);
                
                // HP 숫자 표기 (몬스터 위)
                ctx.fillStyle = '#fff';
                ctx.font = '9px Arial';
                ctx.textAlign = 'center';
                ctx.fillText(`${Math.ceil(m.hp)}`, m.x, m.y - m.radius - 15);

                // 처치 시
                if (m.hp <= 0) {
                    gold += m.isBoss ? 100 : 15;
                    updateUI();
                    minions.splice(i, 1);

                    // 해당 라운드의 모든 몹 제거 완료 시 라운드 증가
                    if (minions.length === 0) {
                        isWaveActive = false;
                        round++;
                        updateUI();
                    }
                }
            }

            // 7. 투사체 및 데미지 Floating 연출
            for (let i = projectiles.length - 1; i >= 0; i--) {
                const p = projectiles[i];
                if (!p.target || p.target.hp <= 0) { projectiles.splice(i, 1); continue; }

                const dx = p.target.x - p.x;
                const dy = p.target.y - p.y;
                const dist = Math.hypot(dx, dy);

                if (dist < p.speed) {
                    p.target.hp -= p.damage;
                    
                    // 🔥 몬스터 위에 floating 데미지 텍스트 생성!
                    floatingTexts.push(new FloatingText(`-${p.damage}`, p.target.x, p.target.y - 10, p.color));
                    
                    projectiles.splice(i, 1);
                } else {
                    p.x += (dx / dist) * p.speed;
                    p.y += (dy / dist) * p.speed;
                    ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2); ctx.fill();
                }
            }

            // 8. Floating 데미지 텍스트 그리기 및 업데이트
            for (let i = floatingTexts.length - 1; i >= 0; i--) {
                floatingTexts[i].update();
                floatingTexts[i].draw();
                if (floatingTexts[i].alpha <= 0) floatingTexts.splice(i, 1);
            }

            requestAnimationFrame(gameLoop);
        }

        updateUI();
        gameLoop();
    </script>
</body>
</html>
