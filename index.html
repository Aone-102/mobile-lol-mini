<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LoL x Random Dice Defense</title>
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; touch-action: none; margin: 0; padding: 0; }
        body { background: #0f141c; color: #fff; font-family: 'Segoe UI', Tahoma, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; overflow: hidden; }

        /* 상단 UI 바 */
        #top-ui {
            width: 100%; max-width: 420px; height: 40px; background: #161c28; display: flex; justify-content: space-between; align-items: center; padding: 0 16px; border-bottom: 2px solid #2c3547; font-size: 13px; font-weight: bold;
        }
        .hp-txt { color: #ff4757; }
        .wave-txt { color: #ffa502; }
        .sp-txt { color: #2ed573; }

        /* 메인 캔버스 */
        #canvas-container { position: relative; width: 100%; max-width: 420px; }
        canvas { background: #121721; display: block; width: 100%; border-radius: 4px; }

        /* 하단 컨트롤러 (롤 스킬 + 주사위 소환) */
        #control-panel {
            width: 100%; max-width: 420px; background: #181f2c; padding: 10px; display: flex; flex-direction: column; gap: 8px; border-top: 2px solid #2c3547;
        }
        .action-row { display: flex; justify-content: space-between; gap: 8px; }

        .btn-skill {
            flex: 1; height: 44px; background: linear-gradient(135deg, #2b354a, #1b2230); border: 1px solid #45536e; border-radius: 8px; color: #38ef7d; font-weight: bold; font-size: 12px; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        .btn-skill:active { transform: scale(0.96); }
        .btn-skill span { font-size: 9px; color: #8a99ad; margin-top: 2px; }

        .btn-spawn {
            width: 100%; height: 46px; background: linear-gradient(135deg, #11998e, #38ef7d); border: none; border-radius: 10px; color: #fff; font-size: 15px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 10px rgba(56, 239, 125, 0.25);
        }
        .btn-spawn:active { transform: scale(0.97); }

        #game-over {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0, 0, 0, 0.85); border: 2px solid #ff4757; padding: 20px 30px; border-radius: 12px; color: #ff4757; font-size: 24px; font-weight: bold; display: none; text-align: center; z-index: 100;
        }
    </style>
</head>
<body>

    <div id="top-ui">
        <div class="hp-txt">❤️ HP <span id="hp">3</span></div>
        <div class="wave-txt">🌊 WAVE <span id="wave">1</span></div>
        <div class="sp-txt">💎 SP <span id="sp">100</span></div>
    </div>

    <div id="canvas-container">
        <canvas id="gameCanvas"></canvas>
        <div id="game-over">GAME OVER</div>
    </div>

    <div id="control-panel">
        <div class="action-row">
            <button class="btn-skill" id="btnQ">Q (광역기)<span id="cdQ">READY</span></button>
            <button class="btn-skill" id="btnW">W (속도 증가)<span id="cdW">READY</span></button>
            <button class="btn-skill" id="btnE">E (궁극기)<span id="cdE">READY</span></button>
        </div>
        <button class="btn-spawn" id="btnSpawn">🎲 주사위 소환 (<span id="spawnCost">10</span> SP)</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        const width = Math.min(window.innerWidth, 420);
        const height = Math.min(window.innerHeight - 150, 520);
        canvas.width = width;
        canvas.height = height;

        // 게임 변수
        let hp = 3;
        let wave = 1;
        let sp = 100;
        let spawnCost = 10;
        let isGameOver = false;

        // 주사위 타입
        const DICE_TYPES = [
            { type: 'fire', color: '#ff4757' },
            { type: 'ice', color: '#1e90ff' },
            { type: 'wind', color: '#2ed573' },
            { type: 'elec', color: '#ffa502' }
        ];

        // 필드 레이아웃 (상단: 롤 챔피언 전투 / 하단: 3x4 랜덤 다이스 판)
        const gridRows = 3;
        const gridCols = 4;
        const tileSize = Math.floor((width - 40) / 4);
        const boardX = (width - (tileSize * gridCols)) / 2;
        const boardY = height - (tileSize * gridRows) - 10;
        let board = Array(gridRows * gridCols).fill(null);

        // 몬스터 라인 트랙
        const waypoints = [
            { x: 20, y: 30 },
            { x: width - 20, y: 30 },
            { x: width - 20, y: boardY - 30 },
            { x: 20, y: boardY - 30 }
        ];

        // 롤 챔피언 객체
        const hero = {
            x: width / 2,
            y: (boardY - 30) / 2,
            targetX: width / 2,
            targetY: (boardY - 30) / 2,
            speed: 3,
            radius: 14,
            attackCd: 0,
            qCd: 0, wCd: 0, eCd: 0,
            wBuff: 0
        };

        let monsters = [];
        let projectiles = [];

        // 드래그 변수
        let dragIdx = null;
        let dragX = 0, dragY = 0;

        function updateUI() {
            document.getElementById('hp').innerText = hp;
            document.getElementById('wave').innerText = wave;
            document.getElementById('sp').innerText = sp;
            document.getElementById('spawnCost').innerText = spawnCost;
            document.getElementById('cdQ').innerText = hero.qCd > 0 ? `${Math.ceil(hero.qCd / 60)}s` : 'READY';
            document.getElementById('cdW').innerText = hero.wCd > 0 ? `${Math.ceil(hero.wCd / 60)}s` : 'READY';
            document.getElementById('cdE').innerText = hero.eCd > 0 ? `${Math.ceil(hero.eCd / 60)}s` : 'READY';
        }

        // 주사위 소환
        function spawnDice() {
            if (sp < spawnCost || isGameOver) return;
            let emptySlots = [];
            board.forEach((v, i) => { if (v === null) emptySlots.push(i); });
            if (emptySlots.length === 0) return;

            sp -= spawnCost;
            spawnCost += 10;
            const slot = emptySlots[Math.floor(Math.random() * emptySlots.length)];
            const dice = DICE_TYPES[Math.floor(Math.random() * DICE_TYPES.length)];

            board[slot] = { type: dice.type, color: dice.color, dot: 1, cooldown: 0 };
            updateUI();
        }
        document.getElementById('btnSpawn').addEventListener('click', spawnDice);

        // 스킬 컨트롤
        document.getElementById('btnQ').addEventListener('click', () => {
            if (hero.qCd <= 0 && !isGameOver) {
                hero.qCd = 300; // 5초
                // 챔피언 주변 폭발
                monsters.forEach(m => {
                    if (Math.hypot(m.x - hero.x, m.y - hero.y) < 100) {
                        m.hp -= 150;
                    }
                });
            }
        });

        document.getElementById('btnW').addEventListener('click', () => {
            if (hero.wCd <= 0 && !isGameOver) {
                hero.wCd = 360; // 6초
                hero.wBuff = 180; // 3초간 속도 증가
            }
        });

        document.getElementById('btnE').addEventListener('click', () => {
            if (hero.eCd <= 0 && !isGameOver) {
                hero.eCd = 600; // 10초
                // 화면 전체 몬스터 강하게 타격
                monsters.forEach(m => { m.hp -= 300; });
            }
        });

        // 클릭/터치 조작 (상단 영역 클릭 시 챔피언 이동, 하단 주사위 드래그)
        function getSlotIndex(x, y) {
            for (let r = 0; r < gridRows; r++) {
                for (let c = 0; c < gridCols; c++) {
                    const sx = boardX + c * tileSize;
                    const sy = boardY + r * tileSize;
                    if (x >= sx && x <= sx + tileSize && y >= sy && y <= sy + tileSize) {
                        return r * gridCols + c;
                    }
                }
            }
            return null;
        }

        canvas.addEventListener('pointerdown', e => {
            if (isGameOver) return;
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            if (y < boardY - 10) {
                // 상단 이동 클릭 (롤 챔피언 이동)
                hero.targetX = x;
                hero.targetY = y;
            } else {
                // 하단 주사위 합성 드래그
                const idx = getSlotIndex(x, y);
                if (idx !== null && board[idx]) {
                    dragIdx = idx;
                    dragX = x; dragY = y;
                }
            }
        });

        canvas.addEventListener('pointermove', e => {
            if (dragIdx === null) return;
            const rect = canvas.getBoundingClientRect();
            dragX = e.clientX - rect.left;
            dragY = e.clientY - rect.top;
        });

        canvas.addEventListener('pointerup', e => {
            if (dragIdx === null) return;
            const rect = canvas.getBoundingClientRect();
            const targetIdx = getSlotIndex(e.clientX - rect.left, e.clientY - rect.top);

            if (targetIdx !== null && targetIdx !== dragIdx && board[targetIdx]) {
                const src = board[dragIdx];
                const dst = board[targetIdx];

                if (src.dot === dst.dot) {
                    const randomDice = DICE_TYPES[Math.floor(Math.random() * DICE_TYPES.length)];
                    board[targetIdx] = {
                        type: randomDice.type,
                        color: randomDice.color,
                        dot: src.dot + 1,
                        cooldown: 0
                    };
                    board[dragIdx] = null;
                }
            }
            dragIdx = null;
        });

        // 게임 업데이트
        let spawnTimer = 0;
        function update() {
            // 쿨다운 감쇠
            if (hero.qCd > 0) hero.qCd--;
            if (hero.wCd > 0) hero.wCd--;
            if (hero.eCd > 0) hero.eCd--;
            if (hero.wBuff > 0) hero.wBuff--;
            updateUI();

            // 챔피언 이동
            const hDx = hero.targetX - hero.x;
            const hDy = hero.targetY - hero.y;
            const hDist = Math.hypot(hDx, hDy);
            const currentSpeed = hero.wBuff > 0 ? hero.speed * 2 : hero.speed;

            if (hDist > currentSpeed) {
                hero.x += (hDx / hDist) * currentSpeed;
                hero.y += (hDy / hDist) * currentSpeed;
            }

            // 챔피언 기본 평타 공격
            if (hero.attackCd > 0) hero.attackCd--;
            if (hero.attackCd <= 0 && monsters.length > 0) {
                let closest = null;
                let minDist = 150;
                monsters.forEach(m => {
                    const d = Math.hypot(m.x - hero.x, m.y - hero.y);
                    if (d < minDist) { minDist = d; closest = m; }
                });

                if (closest) {
                    projectiles.push({
                        x: hero.x, y: hero.y, target: closest,
                        speed: 8, dmg: 35, color: '#00d2d3'
                    });
                    hero.attackCd = 25;
                }
            }

            // 몬스터 스폰
            spawnTimer++;
            if (spawnTimer >= 70) {
                spawnTimer = 0;
                monsters.push({
                    x: waypoints[0].x, y: waypoints[0].y,
                    wp: 1, hp: 80 + wave * 50, maxHp: 80 + wave * 50, speed: 1.3
                });
            }

            // 몬스터 이동
            for (let i = monsters.length - 1; i >= 0; i--) {
                const m = monsters[i];
                if (m.hp <= 0) {
                    monsters.splice(i, 1);
                    sp += 10;
                    continue;
                }

                const target = waypoints[m.wp];
                const dx = target.x - m.x, dy = target.y - m.y;
                const dist = Math.hypot(dx, dy);

                if (dist < m.speed) {
                    m.wp = (m.wp + 1) % waypoints.length;
                    if (m.wp === 1) {
                        hp--;
                        monsters.splice(i, 1);
                        if (hp <= 0) {
                            isGameOver = true;
                            document.getElementById('game-over').style.display = 'block';
                        }
                        continue;
                    }
                } else {
                    m.x += (dx / dist) * m.speed;
                    m.y += (dy / dist) * m.speed;
                }
            }

            // 주사위 공격
            board.forEach((dice, idx) => {
                if (!dice) return;
                if (dice.cooldown > 0) dice.cooldown--;

                if (dice.cooldown <= 0 && monsters.length > 0) {
                    const r = Math.floor(idx / gridCols), c = idx % gridCols;
                    const sx = boardX + c * tileSize + tileSize / 2;
                    const sy = boardY + r * tileSize + tileSize / 2;

                    projectiles.push({
                        x: sx, y: sy, target: monsters[0],
                        speed: 7, dmg: dice.dot * 20, color: dice.color
                    });
                    dice.cooldown = Math.max(15, 45 - dice.dot * 3);
                }
            });

            // 투사체 이동 및 충돌
            for (let i = projectiles.length - 1; i >= 0; i--) {
                const p = projectiles[i];
                if (!p.target || p.target.hp <= 0) { projectiles.splice(i, 1); continue; }

                const dx = p.target.x - p.x, dy = p.target.y - p.y;
                const dist = Math.hypot(dx, dy);

                if (dist < p.speed) {
                    p.target.hp -= p.dmg;
                    projectiles.splice(i, 1);
                } else {
                    p.x += (dx / dist) * p.speed;
                    p.y += (dy / dist) * p.speed;
                }
            }
        }

        // 게임 렌더링
        function render() {
            ctx.clearRect(0, 0, width, height);

            // 1. 트랙
            ctx.strokeStyle = '#232d3f';
            ctx.lineWidth = 16;
            ctx.lineJoin = 'round';
            ctx.beginPath();
            ctx.moveTo(waypoints[0].x, waypoints[0].y);
            waypoints.forEach(wp => ctx.lineTo(wp.x, wp.y));
            ctx.closePath();
            ctx.stroke();

            // 2. 롤 챔피언
            ctx.fillStyle = hero.wBuff > 0 ? '#fffa65' : '#00d2d3';
            ctx.beginPath();
            ctx.arc(hero.x, hero.y, hero.radius, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 2;
            ctx.stroke();

            // 3. 몬스터
            monsters.forEach(m => {
                ctx.fillStyle = '#ff4757';
                ctx.beginPath(); ctx.arc(m.x, m.y, 10, 0, Math.PI * 2); ctx.fill();
                // 체력바
                ctx.fillStyle = '#333'; ctx.fillRect(m.x - 12, m.y - 16, 24, 4);
                ctx.fillStyle = '#2ed573'; ctx.fillRect(m.x - 12, m.y - 16, Math.max(0, (m.hp / m.maxHp) * 24), 4);
            });

            // 4. 투사체
            projectiles.forEach(p => {
                ctx.fillStyle = p.color;
                ctx.beginPath(); ctx.arc(p.x, p.y, 4, 0, Math.PI * 2); ctx.fill();
            });

            // 5. 주사위 보드
            for (let r = 0; r < gridRows; r++) {
                for (let c = 0; c < gridCols; c++) {
                    const idx = r * gridCols + c;
                    const sx = boardX + c * tileSize;
                    const sy = boardY + r * tileSize;

                    ctx.fillStyle = '#181f2c';
                    ctx.fillRect(sx + 2, sy + 2, tileSize - 4, tileSize - 4);
                    ctx.strokeStyle = '#2c3547';
                    ctx.lineWidth = 1;
                    ctx.strokeRect(sx + 2, sy + 2, tileSize - 4, tileSize - 4);

                    const dice = board[idx];
                    if (dice && idx !== dragIdx) {
                        drawDice(sx + tileSize / 2, sy + tileSize / 2, dice);
                    }
                }
            }

            // 드래그 중인 주사위
            if (dragIdx !== null && board[dragIdx]) {
                drawDice(dragX, dragY, board[dragIdx]);
            }
        }

        function drawDice(cx, cy, dice) {
            const size = tileSize - 12;
            ctx.fillStyle = dice.color;
            ctx.beginPath();
            ctx.roundRect(cx - size / 2, cy - size / 2, size, size, 8);
            ctx.fill();

            ctx.fillStyle = '#fff';
            ctx.font = 'bold 12px Arial';
            ctx.textAlign = 'center';
            ctx.fillText(`● ${dice.dot}`, cx, cy + 4);
            ctx.textAlign = 'left';
        }

        function gameLoop() {
            if (!isGameOver) {
                update();
                render();
            }
            requestAnimationFrame(gameLoop);
        }

        updateUI();
        gameLoop();
    </script>
</body>
</html>
