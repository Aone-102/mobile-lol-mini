<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <title>하이퍼 어택 Ultra (P2P 로비 & 대전/협동)</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; touch-action: none; margin: 0; padding: 0; }
        body { background-color: #0b0e14; color: #fff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; overflow: hidden; }

        /* 로비 화면 */
        #lobby-screen {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: #12181b; z-index: 500; display: flex; flex-direction: column;
            align-items: center; justify-content: center; padding: 20px; text-align: center;
        }
        .lobby-title { font-size: 28px; font-weight: bold; color: #f39c12; margin-bottom: 20px; text-shadow: 0 0 10px #f39c12; }
        .lobby-card { background: rgba(22, 26, 35, 0.95); border: 2px solid #444; border-radius: 12px; padding: 20px; width: 100%; max-width: 360px; margin-bottom: 15px; }
        .lobby-btn { width: 100%; padding: 12px; margin: 6px 0; background: #3498db; color: #fff; border: none; border-radius: 6px; font-weight: bold; font-size: 14px; cursor: pointer; }
        .lobby-btn:active { transform: scale(0.98); }
        .btn-mode { background: #8e44ad; }
        .btn-start { background: #2ecc71; font-size: 16px; margin-top: 10px; }
        .mode-selected { border: 2px solid #f1c40f !important; background: #9b59b6 !important; }

        /* 게임 UI */
        #top-ui {
            display: flex; justify-content: space-between; align-items: center;
            width: 100%; max-width: 480px; padding: 8px 12px;
            background-color: rgba(22, 26, 35, 0.95);
            font-size: 12px; font-weight: bold; border-bottom: 2px solid #333; position: fixed; top: 0; z-index: 10;
        }
        .ui-group { display: flex; gap: 8px; align-items: center; }
        .hp-bar-container { width: 70px; height: 14px; background-color: #333; border: 1px solid #555; border-radius: 7px; overflow: hidden; position: relative; }
        .hp-bar-fill { height: 100%; transition: width 0.1s linear; }
        .hp-player { background-color: #3498db; width: 100%; }
        .hp-tower { background-color: #e74c3c; width: 100%; }
        .hp-bar-text { position: absolute; top: 0; left: 0; width: 100%; height: 100%; font-size: 9px; text-align: center; line-height: 14px; color: #fff; font-weight: bold; text-shadow: 0 0 2px #000; }

        canvas { background-color: #12181b; box-shadow: 0 4px 20px rgba(0,0,0,0.8); margin-top: 36px; }

        #chat-container { position: absolute; bottom: 80px; left: 10px; width: 220px; background: rgba(0, 0, 0, 0.6); border-radius: 6px; padding: 6px; display: flex; flex-direction: column; gap: 4px; z-index: 20; }
        #chat-logs { height: 70px; overflow-y: auto; font-size: 11px; display: flex; flex-direction: column; gap: 2px; }
        .chat-msg { color: #ddd; word-break: break-all; }
        .chat-sys { color: #f1c40f; font-weight: bold; }
        #chat-input-box { display: flex; gap: 4px; }
        #chat-input { flex: 1; background: rgba(255,255,255,0.1); border: 1px solid #555; color: #fff; border-radius: 3px; padding: 2px 5px; font-size: 11px; }

        #controls-overlay { position: absolute; bottom: 15px; right: 10px; display: flex; gap: 6px; z-index: 10; }
        #menu-overlay { position: absolute; bottom: 15px; left: 240px; display: flex; gap: 6px; z-index: 10; }
        .btn-ui { width: 46px; height: 46px; border-radius: 50%; border: 2px solid #f39c12; background: rgba(44, 62, 80, 0.9); color: #fff; font-weight: bold; font-size: 11px; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; }
        .btn-ui:active { transform: scale(0.92); }
        .btn-stat { border-color: #3498db; }
        .btn-shop { border-color: #2ecc71; }
        .btn-skill-cd { font-size: 8px; color: #f1c40f; margin-top: 2px; }

        .modal { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 90%; max-width: 400px; max-height: 85vh; overflow-y: auto; background: rgba(22, 26, 35, 0.98); border: 2px solid #f39c12; border-radius: 12px; padding: 16px; display: none; flex-direction: column; gap: 10px; z-index: 100; }
        .modal-title { font-size: 16px; font-weight: bold; text-align: center; color: #f39c12; border-bottom: 1px solid #444; padding-bottom: 6px; }
        .modal-content { font-size: 12px; line-height: 1.5; }
        .shop-section-title { font-size: 12px; color: #f1c40f; font-weight: bold; margin: 8px 0 4px 0; border-left: 3px solid #f1c40f; padding-left: 6px; }
        .shop-item { display: flex; justify-content: space-between; align-items: center; background: rgba(255,255,255,0.05); padding: 6px 8px; border-radius: 6px; margin-bottom: 4px; }
        .btn-buy { background: #2ecc71; color: #fff; border: none; padding: 4px 8px; border-radius: 4px; font-weight: bold; font-size: 10px; cursor: pointer; }
        .btn-bought { background: #7f8c8d !important; cursor: not-allowed; }
        .btn-close { background: #e74c3c; color: #fff; border: none; padding: 6px; border-radius: 6px; font-weight: bold; margin-top: 5px; cursor: pointer; }
    </style>
</head>
<body>

    <!-- 멀티플레이 로비 화면 -->
    <div id="lobby-screen">
        <div class="lobby-title">⚔️ 하이퍼 어택 ULTRA</div>
        <div class="lobby-card">
            <p id="lobbyStatus" style="color:#f1c40f; font-size:12px; margin-bottom:10px;">방을 생성하거나 참가하세요.</p>
            <button class="lobby-btn" onclick="createLobbyRoom()">방 만들기 (Host)</button>
            <div style="display:flex; gap:4px; margin-top:6px;">
                <input type="text" id="lobbyCodeInput" placeholder="4자리 방 코드" style="flex:1; background:#222; border:1px solid #555; color:#fff; padding:8px; border-radius:6px; font-size:13px;">
                <button class="lobby-btn" style="width:70px; margin:0;" onclick="joinLobbyRoom()">참가</button>
            </div>
        </div>

        <div class="lobby-card" id="modeSelectCard" style="display:none;">
            <p style="font-size:12px; color:#aaa; margin-bottom:8px;">게임 모드 선택 (Host 전용)</p>
            <div style="display:flex; gap:6px;">
                <button class="lobby-btn btn-mode mode-selected" id="btnModeCoop" onclick="selectGameMode('coop')">🤝 협동 모드</button>
                <button class="lobby-btn btn-mode" id="btnModePvp" onclick="selectGameMode('pvp')">⚔️ 대전 모드</button>
            </div>
            <button class="lobby-btn btn-start" id="btnStartGame" style="display:none;" onclick="requestStartGame()">게임 시작</button>
        </div>
    </div>

    <!-- 상단 게임 UI -->
    <div id="top-ui">
        <div class="ui-group">
            <div>🚩 R<span id="round">1</span></div>
            <div>💰 <span id="gold">0</span>G</div>
        </div>
        <div class="ui-group">
            <span id="labelP1">👤P1</span>
            <div class="hp-bar-container">
                <div class="hp-bar-fill hp-player" id="playerHpBar"></div>
                <div class="hp-bar-text" id="playerHpText">200 / 200</div>
            </div>
            <span id="labelP2">🏰타워</span>
            <div class="hp-bar-container">
                <div class="hp-bar-fill hp-tower" id="towerHpBar"></div>
                <div class="hp-bar-text" id="towerHpText">1500 / 1500</div>
            </div>
        </div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <div id="chat-container">
        <div id="chat-logs"><div class="chat-msg chat-sys">[시스템] 로비에 접속했습니다.</div></div>
        <div id="chat-input-box">
            <input type="text" id="chat-input" placeholder="메시지 입력..." onkeypress="handleChatKey(event)">
        </div>
    </div>

    <div id="menu-overlay">
        <button class="btn-ui btn-stat" id="btnOpenStat">스탯</button>
        <button class="btn-ui btn-shop" id="btnOpenShop">상점</button>
    </div>

    <div id="controls-overlay">
        <button class="btn-ui" id="btnQ">Q<span class="btn-skill-cd" id="cdQ">READY</span></button>
        <button class="btn-ui" id="btnW">W<span class="btn-skill-cd" id="cdW">READY</span></button>
        <button class="btn-ui" id="btnE">E<span class="btn-skill-cd" id="cdE">READY</span></button>
    </div>

    <!-- 스탯 및 상점 모달 -->
    <div class="modal" id="modalStat">
        <div class="modal-title">챔피언 스탯</div>
        <div class="modal-content" id="statContent"></div>
        <button class="btn-close" onclick="closeModal('modalStat')">닫기</button>
    </div>

    <div class="modal" id="modalShop">
        <div class="modal-title">아이템 상점</div>
        <div class="modal-content" id="shopContent"></div>
        <button class="btn-close" onclick="closeModal('modalShop')">닫기</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        const canvasWidth = Math.min(window.innerWidth, 480);
        const canvasHeight = Math.min(window.innerHeight - 36, 640);
        canvas.width = canvasWidth;
        canvas.height = canvasHeight;

        const midLineY = canvasHeight * 0.45;

        let gold = 0;
        let round = 1;
        let isGameOver = false;
        let gameStarted = false;

        let selectedMode = 'coop'; // 'coop' 또는 'pvp'
        let isHost = false;

        let roundBannerTimer = 0;
        let roundBannerText = "";

        // PeerJS 변수
        let peer = null;
        let peerConn = null;

        const player = {
            x: canvasWidth / 2, y: canvasHeight - 120,
            targetX: canvasWidth / 2, targetY: canvasHeight - 120,
            radius: 18, moveSpeed: 3.8,
            hp: 200, maxHp: 200,
            attackPower: 30, attackBaseCooldown: 15, attackCooldown: 0, attackRange: 170,
            qBuffTimer: 0, qCooldown: 0, wBuffTimer: 0, wCooldown: 0, eCooldown: 0,
            lifesteal: 0, scopeChance: 0.25, explosionChance: 0
        };

        let remotePlayer = { x: canvasWidth / 2 + 40, y: canvasHeight - 120, hp: 200, maxHp: 200 };

        const tower = { x: canvasWidth / 2, y: canvasHeight - 40, radius: 30, hp: 1500, maxHp: 1500 };

        const statUpgrades = {
            atk: { level: 0, basePrice: 50, priceMult: 1.4 },
            spd: { level: 0, basePrice: 70, priceMult: 1.5 }
        };

        const equipmentItems = [
            { id: 'doran', name: '🗡️ 도란의 검', desc: '공격력 +15, 체력 +40', price: 150, bought: false, apply: () => { player.attackPower += 15; player.maxHp += 40; player.hp += 40; } },
            { id: 'boots', name: '👟 광전사의 신발', desc: '이속 +0.8, 공속 +15%', price: 220, bought: false, apply: () => { player.moveSpeed += 0.8; player.attackBaseCooldown = Math.max(3, Math.floor(player.attackBaseCooldown * 0.85)); } },
            { id: 'vamp', name: '🩸 흡혈의 낫', desc: '타격 시 체력 +4 회복', price: 280, bought: false, apply: () => { player.lifesteal += 4; } },
            { id: 'expOrb', name: '💥 폭발의 구슬', desc: '30% 확률 탄환 폭발', price: 300, bought: false, apply: () => { player.explosionChance += 0.3; } },
            { id: 'warmog', name: '🛡️ 워모그의 갑옷', desc: '체력 +150 & 타워 +300', price: 350, bought: false, apply: () => { player.maxHp += 150; player.hp += 150; tower.maxHp += 300; tower.hp = Math.min(tower.maxHp, tower.hp + 300); } }
        ];

        let minions = [];
        let projectiles = [];
        let floatingTexts = [];
        let explosions = [];
        let scopeEffects = [];
        let shockwaves = [];

        // ================= WebRTC & 로비 시스템 =================
        const peerConfig = {
            config: { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }, { urls: 'stun:stun1.l.google.com:19302' }] }
        };

        function initPeer(customId = null, callback = null) {
            if (peer) peer.destroy();
            peer = customId ? new Peer(customId, peerConfig) : new Peer(peerConfig);

            peer.on('open', (id) => {
                document.getElementById('lobbyStatus').innerText = `방 생성 성공! 코드: ${id}\n상대방 접속을 기다리는 중...`;
                if (callback) callback(id);
            });

            peer.on('connection', (conn) => {
                peerConn = conn;
                setupLobbyConnection();
            });

            peer.on('error', (err) => {
                document.getElementById('lobbyStatus').innerText = `연결 실패: ${err.type}`;
            });
        }

        function createLobbyRoom() {
            isHost = true;
            const code = "room-" + Math.floor(1000 + Math.random() * 9000);
            document.getElementById('lobbyStatus').innerText = "방 생성 중...";
            initPeer(code);
        }

        function joinLobbyRoom() {
            isHost = false;
            const inputVal = document.getElementById('lobbyCodeInput').value.trim();
            if (!inputVal) return alert("방 코드를 입력하세요.");

            const targetId = inputVal.startsWith('room-') ? inputVal : 'room-' + inputVal;
            document.getElementById('lobbyStatus').innerText = "접속 시도 중...";

            initPeer(null, () => {
                peerConn = peer.connect(targetId, { reliable: true });
                setupLobbyConnection();
            });
        }

        function setupLobbyConnection() {
            peerConn.on('open', () => {
                document.getElementById('lobbyStatus').innerText = "상대방과 연결되었습니다!";
                document.getElementById('modeSelectCard').style.display = 'block';
                if (isHost) document.getElementById('btnStartGame').style.display = 'block';
                addChatLog("[시스템] 상대방이 로비에 입장했습니다.", true);
            });

            peerConn.on('data', (data) => {
                if (data.type === 'SELECT_MODE') {
                    selectedMode = data.mode;
                    updateModeUI();
                } else if (data.type === 'START_GAME') {
                    selectedMode = data.mode;
                    startGame(false);
                } else if (data.type === 'POS') {
                    remotePlayer.x = data.x;
                    remotePlayer.y = data.y;
                    remotePlayer.hp = data.hp;
                    remotePlayer.maxHp = data.maxHp;
                } else if (data.type === 'CHAT') {
                    addChatLog(`상대: ${data.msg}`);
                } else if (data.type === 'SPAWN_MINION' && !isHost) {
                    minions.push(data.minion);
                } else if (data.type === 'ROUND_START' && !isHost) {
                    round = data.round;
                    triggerRoundBanner(round);
                } else if (data.type === 'SHOOT') {
                    projectiles.push({
                        x: data.x, y: data.y, target: { x: data.tx, y: data.ty, hp: 10 },
                        speed: 12, damage: data.damage, color: '#9b59b6', radius: 5
                    });
                }
            });
        }

        function selectGameMode(mode) {
            if (!isHost) return;
            selectedMode = mode;
            updateModeUI();
            if (peerConn && peerConn.open) {
                peerConn.send({ type: 'SELECT_MODE', mode: selectedMode });
            }
        }

        function updateModeUI() {
            document.getElementById('btnModeCoop').classList.toggle('mode-selected', selectedMode === 'coop');
            document.getElementById('btnModePvp').classList.toggle('mode-selected', selectedMode === 'pvp');
        }

        function requestStartGame() {
            if (!isHost) return;
            if (peerConn && peerConn.open) {
                peerConn.send({ type: 'START_GAME', mode: selectedMode });
            }
            startGame(true);
        }

        function startGame(hostFlag) {
            document.getElementById('lobby-screen').style.display = 'none';
            gameStarted = true;

            if (selectedMode === 'pvp') {
                if (!hostFlag) {
                    player.y = 80;
                    player.targetY = 80;
                }
                document.getElementById('labelP1').innerText = "👤P1";
                document.getElementById('labelP2').innerText = "👤P2";
            } else {
                document.getElementById('labelP1').innerText = "👤P1";
                document.getElementById('labelP2').innerText = "🏰타워";
            }
            addChatLog(`[게임 시작] ${selectedMode === 'coop' ? '협동 모드' : '대전 모드'}가 시작되었습니다!`, true);
        }

        // ================= 게임 루프 & 로직 =================
        function handleChatKey(e) {
            if (e.key === 'Enter') {
                const input = document.getElementById('chat-input');
                const val = input.value.trim();
                if (!val) return;
                addChatLog(`나: ${val}`);
                if (peerConn && peerConn.open) peerConn.send({ type: 'CHAT', msg: val });
                input.value = '';
            }
        }

        function addChatLog(msg, isSys = false) {
            const logs = document.getElementById('chat-logs');
            const div = document.createElement('div');
            div.className = isSys ? 'chat-msg chat-sys' : 'chat-msg';
            div.innerText = msg;
            logs.appendChild(div);
            logs.scrollTop = logs.scrollHeight;
        }

        function updateUI() {
            document.getElementById('gold').innerText = gold;
            document.getElementById('round').innerText = round;

            document.getElementById('playerHpBar').style.width = Math.max(0, (player.hp / player.maxHp) * 100) + '%';
            document.getElementById('playerHpText').innerText = `${Math.ceil(Math.max(0, player.hp))} / ${player.maxHp}`;

            if (selectedMode === 'coop') {
                document.getElementById('towerHpBar').style.width = Math.max(0, (tower.hp / tower.maxHp) * 100) + '%';
                document.getElementById('towerHpText').innerText = `${Math.ceil(Math.max(0, tower.hp))} / ${tower.maxHp}`;
            } else {
                document.getElementById('towerHpBar').style.width = Math.max(0, (remotePlayer.hp / remotePlayer.maxHp) * 100) + '%';
                document.getElementById('towerHpText').innerText = `${Math.ceil(Math.max(0, remotePlayer.hp))} / ${remotePlayer.maxHp}`;
            }

            document.getElementById('cdQ').innerText = player.qCooldown > 0 ? `${Math.ceil(player.qCooldown / 60)}s` : 'READY';
            document.getElementById('cdW').innerText = player.wCooldown > 0 ? `${Math.ceil(player.wCooldown / 60)}s` : 'READY';
            document.getElementById('cdE').innerText = player.eCooldown > 0 ? `${Math.ceil(player.eCooldown / 60)}s` : 'READY';
        }

        function renderShop() {
            const atkPrice = Math.floor(statUpgrades.atk.basePrice * Math.pow(statUpgrades.atk.priceMult, statUpgrades.atk.level));
            const spdPrice = Math.floor(statUpgrades.spd.basePrice * Math.pow(statUpgrades.spd.priceMult, statUpgrades.spd.level));

            let html = `
                <div class="shop-section-title">⚡ 스탯 강화</div>
                <div class="shop-item"><div><b>공격력 +10</b> (Lv.${statUpgrades.atk.level})<br><small style="color:#aaa">${atkPrice}G</small></div><button class="btn-buy" onclick="buyStatUpgrade('atk')">구매</button></div>
                <div class="shop-item"><div><b>공속 +10%</b> (Lv.${statUpgrades.spd.level})<br><small style="color:#aaa">${spdPrice}G</small></div><button class="btn-buy" onclick="buyStatUpgrade('spd')">구매</button></div>
                <div class="shop-section-title">🗡️ 장비 아이템</div>
            `;
            equipmentItems.forEach((item, idx) => {
                html += `<div class="shop-item"><div><b>${item.name}</b><br><small style="color:#aaa">${item.desc} / ${item.price}G</small></div>
                ${item.bought ? `<button class="btn-buy btn-bought" disabled>완료</button>` : `<button class="btn-buy" onclick="buyEquipment(${idx})">구매</button>`}</div>`;
            });
            document.getElementById('shopContent').innerHTML = html;
        }

        function buyStatUpgrade(type) {
            const stat = statUpgrades[type];
            const price = Math.floor(stat.basePrice * Math.pow(stat.priceMult, stat.level));
            if (gold >= price) {
                gold -= price;
                if (type === 'atk') player.attackPower += 10;
                else player.attackBaseCooldown = Math.max(3, Math.floor(player.attackBaseCooldown * 0.9));
                stat.level++; updateUI(); renderShop();
            }
        }

        function buyEquipment(idx) {
            const item = equipmentItems[idx];
            if (!item.bought && gold >= item.price) {
                gold -= item.price; item.bought = true; item.apply();
                updateUI(); renderShop();
            }
        }

        canvas.addEventListener('pointerdown', (e) => {
            if (!gameStarted || isGameOver) return;
            const rect = canvas.getBoundingClientRect();
            player.targetX = e.clientX - rect.left;
            player.targetY = e.clientY - rect.top;
        });

        document.getElementById('btnQ').addEventListener('pointerdown', (e) => { e.stopPropagation(); if (player.qCooldown <= 0) { player.qBuffTimer = 180; player.qCooldown = 360; } });
        document.getElementById('btnW').addEventListener('pointerdown', (e) => { e.stopPropagation(); if (player.wCooldown <= 0) { player.wBuffTimer = 150; player.wCooldown = 420; } });
        document.getElementById('btnE').addEventListener('pointerdown', (e) => {
            e.stopPropagation();
            if (player.eCooldown <= 0) {
                player.eCooldown = 500;
                shockwaves.push({ x: player.x, y: player.y, radius: 10, maxRadius: 160, alpha: 1.0 });
                minions.forEach(m => {
                    if (Math.hypot(m.x - player.x, m.y - player.y) <= 160) {
                        const dmg = Math.floor(player.attackPower * 2.5);
                        m.hp -= dmg;
                        floatingTexts.push(new FloatingText(`-${dmg}`, m.x, m.y - 15, '#f1c40f'));
                    }
                });
            }
        });

        document.getElementById('btnOpenStat').addEventListener('pointerdown', (e) => {
            e.stopPropagation();
            document.getElementById('statContent').innerHTML = `
                • 모드: <b>${selectedMode === 'coop' ? '협동' : '대전'}</b><br>
                • 체력: <b>${player.hp} / ${player.maxHp}</b><br>
                • 공격력: <b>${player.attackPower}</b><br>
                • 조준경/폭발 확률: <b>${Math.round(player.scopeChance * 100)}% / ${Math.round(player.explosionChance * 100)}%</b>
            `;
            document.getElementById('modalStat').style.display = 'flex';
        });

        document.getElementById('btnOpenShop').addEventListener('pointerdown', (e) => { e.stopPropagation(); renderShop(); document.getElementById('modalShop').style.display = 'flex'; });
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }

        class FloatingText {
            constructor(text, x, y, color = '#ffda79') { this.text = text; this.x = x; this.y = y; this.color = color; this.alpha = 1; }
            update() { this.y -= 1.2; this.alpha -= 0.03; }
            draw() {
                ctx.save(); ctx.globalAlpha = Math.max(0, this.alpha);
                ctx.font = 'bold 12px Arial'; ctx.fillStyle = this.color;
                ctx.fillText(this.text, this.x, this.y); ctx.restore();
            }
        }

        let isWaveActive = false;
        function triggerRoundBanner(roundNum) { roundBannerText = `ROUND ${roundNum}`; roundBannerTimer = 90; }

        function startNextWaveHost() {
            if (!isHost || selectedMode === 'pvp') return;
            isWaveActive = true;
            triggerRoundBanner(round);
            if (peerConn && peerConn.open) peerConn.send({ type: 'ROUND_START', round: round });

            let enemyCount = 5 + round * 2;
            let spawned = 0;

            const spawnInterval = setInterval(() => {
                if (isGameOver) { clearInterval(spawnInterval); return; }
                const isChaser = Math.random() < 0.35;
                const minionData = {
                    x: Math.random() * (canvasWidth - 80) + 40, y: -20,
                    radius: isChaser ? 15 : 13, speed: 0.9 + round * 0.1,
                    hp: 100 + round * 35, maxHp: 100 + round * 35,
                    isChaser: isChaser, isBoss: false,
                    attackPower: Math.floor(player.attackPower * 0.4), attackCooldown: 0, attackRate: 90
                };
                minions.push(minionData);
                if (peerConn && peerConn.open) peerConn.send({ type: 'SPAWN_MINION', minion: minionData });
                
                spawned++;
                if (spawned >= enemyCount) {
                    clearInterval(spawnInterval);
                    setTimeout(() => {
                        const bossData = {
                            x: canvasWidth / 2, y: -30, radius: 24,
                            speed: 0.5 + round * 0.05, hp: 450 + round * 320, maxHp: 450 + round * 320,
                            isChaser: false, isBoss: true, attackPower: 30, attackCooldown: 0, attackRate: 60
                        };
                        minions.push(bossData);
                        if (peerConn && peerConn.open) peerConn.send({ type: 'SPAWN_MINION', minion: bossData });
                    }, 1000);
                }
            }, 600);
        }

        function gameLoop() {
            if (!gameStarted || isGameOver) { requestAnimationFrame(gameLoop); return; }

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            ctx.strokeStyle = 'rgba(255, 255, 255, 0.08)';
            ctx.beginPath(); ctx.moveTo(0, midLineY); ctx.lineTo(canvasWidth, midLineY); ctx.stroke();

            if (isHost && !isWaveActive && minions.length === 0 && selectedMode === 'coop') {
                startNextWaveHost();
            }

            if (player.qCooldown > 0) player.qCooldown--;
            if (player.wCooldown > 0) player.wCooldown--;
            if (player.eCooldown > 0) player.eCooldown--;

            let currentSpeed = player.moveSpeed * (player.wBuffTimer > 0 ? 1.8 : 1);
            if (player.wBuffTimer > 0) player.wBuffTimer--;

            const dx = player.targetX - player.x;
            const dy = player.targetY - player.y;
            const dist = Math.hypot(dx, dy);
            if (dist > 2) {
                player.x += (dx / dist) * currentSpeed;
                player.y += (dy / dist) * currentSpeed;
            }

            if (peerConn && peerConn.open) {
                peerConn.send({ type: 'POS', x: player.x, y: player.y, hp: player.hp, maxHp: player.maxHp });
            }

            let currentCooldown = player.attackBaseCooldown;
            if (player.qBuffTimer > 0) {
                currentCooldown = Math.max(1, Math.floor(player.attackBaseCooldown * 0.1));
                player.qBuffTimer--;
            }

            if (player.attackCooldown > 0) player.attackCooldown--;
            if (player.attackCooldown === 0) {
                let targets = [];
                if (selectedMode === 'coop') {
                    targets = minions.filter(m => Math.hypot(m.x - player.x, m.y - player.y) <= player.attackRange)
                                     .sort((a, b) => Math.hypot(a.x - player.x, a.y - player.y) - Math.hypot(b.x - player.x, b.y - player.y));
                } else if (selectedMode === 'pvp') {
                    if (Math.hypot(remotePlayer.x - player.x, remotePlayer.y - player.y) <= player.attackRange) {
                        targets = [remotePlayer];
                    }
                }

                if (targets.length > 0) {
                    projectiles.push({
                        x: player.x, y: player.y, target: targets[0], speed: 12,
                        damage: player.attackPower, color: '#2ecc71', radius: 5
                    });

                    if (peerConn && peerConn.open) {
                        peerConn.send({ type: 'SHOOT', x: player.x, y: player.y, tx: targets[0].x, ty: targets[0].y, damage: player.attackPower });
                    }
                    player.attackCooldown = currentCooldown;
                }
            }

            // 내 챔피언
            ctx.fillStyle = '#3498db'; ctx.beginPath(); ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2); ctx.fill();

            // 상대방 챔피언
            ctx.fillStyle = '#9b59b6'; ctx.beginPath(); ctx.arc(remotePlayer.x, remotePlayer.y, player.radius, 0, Math.PI * 2); ctx.fill();
            ctx.font = 'bold 10px Arial'; ctx.fillStyle = '#e056fd'; ctx.textAlign = 'center';
            ctx.fillText("P2", remotePlayer.x, remotePlayer.y - player.radius - 6);

            // 협동 모드 타워
            if (selectedMode === 'coop') {
                ctx.fillStyle = '#e74c3c'; ctx.beginPath(); ctx.arc(tower.x, tower.y, tower.radius, 0, Math.PI * 2); ctx.fill();
            }

            // 미니언
            for (let i = minions.length - 1; i >= 0; i--) {
                const m = minions[i];
                if (m.isChaser) {
                    const d = Math.hypot(player.x - m.x, player.y - m.y);
                    if (d > player.radius + m.radius) {
                        m.x += ((player.x - m.x) / d) * m.speed; m.y += ((player.y - m.y) / d) * m.speed;
                    } else if (m.attackCooldown-- <= 0) {
                        player.hp -= m.attackPower; m.attackCooldown = m.attackRate;
                    }
                } else {
                    if (m.y < midLineY) m.y += m.speed;
                    else {
                        const d = Math.hypot(tower.x - m.x, tower.y - m.y);
                        if (d > tower.radius + m.radius) {
                            m.x += ((tower.x - m.x) / d) * m.speed; m.y += ((tower.y - m.y) / d) * m.speed;
                        } else if (m.attackCooldown-- <= 0) {
                            tower.hp -= m.isBoss ? 40 : 15; m.attackCooldown = m.attackRate;
                        }
                    }
                }

                ctx.fillStyle = m.isBoss ? '#8e44ad' : (m.isChaser ? '#e67e22' : '#e74c3c');
                ctx.beginPath(); ctx.arc(m.x, m.y, m.radius, 0, Math.PI * 2); ctx.fill();

                if (m.hp <= 0) {
                    gold += m.isBoss ? 100 : 15; minions.splice(i, 1);
                    if (minions.length === 0 && isHost) { isWaveActive = false; round++; }
                }
            }

            // 투사체
            for (let i = projectiles.length - 1; i >= 0; i--) {
                const p = projectiles[i];
                if (!p.target) { projectiles.splice(i, 1); continue; }
                const d = Math.hypot(p.target.x - p.x, p.target.y - p.y);
                if (d < p.speed) {
                    if (p.target === remotePlayer) remotePlayer.hp -= p.damage;
                    else p.target.hp -= p.damage;

                    floatingTexts.push(new FloatingText(`-${p.damage}`, p.target.x, p.target.y - 10, p.color));
                    projectiles.splice(i, 1);
                } else {
                    p.x += ((p.target.x - p.x) / d) * p.speed; p.y += ((p.target.y - p.y) / d) * p.speed;
                    ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2); ctx.fill();
                }
            }

            for (let i = floatingTexts.length - 1; i >= 0; i--) {
                floatingTexts[i].update(); floatingTexts[i].draw();
                if (floatingTexts[i].alpha <= 0) floatingTexts.splice(i, 1);
            }

            if (roundBannerTimer > 0) {
                ctx.save();
                ctx.globalAlpha = Math.min(1, roundBannerTimer / 30);
                ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
                ctx.fillRect(0, canvasHeight / 2 - 35, canvasWidth, 70);
                ctx.font = 'bold 28px Arial'; ctx.fillStyle = '#f1c40f'; ctx.textAlign = 'center';
                ctx.fillText(roundBannerText, canvasWidth / 2, canvasHeight / 2 + 10);
                ctx.restore();
                roundBannerTimer--;
            }

            updateUI();
            requestAnimationFrame(gameLoop);
        }

        updateUI();
        gameLoop();
    </script>
</body>
</html>
