<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <title>모바일 LOL: 하이퍼 어택 Ultra</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #0b0e14;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        #top-ui {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 480px;
            padding: 8px 12px;
            background-color: rgba(22, 26, 35, 0.95);
            backdrop-filter: blur(5px);
            font-size: 12px;
            font-weight: bold;
            border-bottom: 2px solid #333;
            position: fixed;
            top: 0;
            z-index: 10;
        }
        .ui-group {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .hp-bar-container {
            width: 75px;
            height: 14px;
            background-color: #333;
            border: 1px solid #555;
            border-radius: 7px;
            overflow: hidden;
            position: relative;
        }
        .hp-bar-fill {
            height: 100%;
            transition: width 0.1s linear;
        }
        .hp-player { background-color: #3498db; width: 100%; }
        .hp-tower { background-color: #e74c3c; width: 100%; }
        .hp-bar-text {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            font-size: 9px; text-align: center; line-height: 14px;
            color: #fff; font-weight: bold; text-shadow: 0 0 2px #000;
        }
        canvas {
            background-color: #12181b;
            box-shadow: 0 4px 20px rgba(0,0,0,0.8);
            margin-top: 36px;
        }
        #controls-overlay {
            position: absolute; bottom: 20px; right: 15px;
            display: flex; gap: 8px; z-index: 10;
        }
        #menu-overlay {
            position: absolute; bottom: 20px; left: 15px;
            display: flex; gap: 8px; z-index: 10;
        }
        .btn-ui {
            width: 52px; height: 52px; border-radius: 50%;
            border: 2px solid #f39c12; background: rgba(44, 62, 80, 0.9);
            color: #fff; font-weight: bold; font-size: 11px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            cursor: pointer; box-shadow: 0 4px 8px rgba(0,0,0,0.5);
        }
        .btn-ui:active { transform: scale(0.92); }
        .btn-stat { border-color: #3498db; }
        .btn-shop { border-color: #2ecc71; }
        .btn-skill-cd { font-size: 9px; color: #f1c40f; margin-top: 2px; }

        .modal {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 90%; max-width: 400px;
            max-height: 85vh;
            overflow-y: auto;
            background: rgba(22, 26, 35, 0.98);
            border: 2px solid #f39c12; border-radius: 12px; padding: 16px;
            display: none; flex-direction: column; gap: 10px; z-index: 100;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
        }
        .modal-title { font-size: 17px; font-weight: bold; text-align: center; color: #f39c12; border-bottom: 1px solid #444; padding-bottom: 6px; }
        .modal-content { font-size: 13px; line-height: 1.5; }
        
        .shop-section-title {
            font-size: 12px; color: #f1c40f; font-weight: bold;
            margin: 8px 0 4px 0; border-left: 3px solid #f1c40f; padding-left: 6px;
        }
        .shop-item {
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(255,255,255,0.05); padding: 8px 10px; border-radius: 6px; margin-bottom: 5px;
        }
        .btn-buy {
            background: #2ecc71; color: #fff; border: none; padding: 6px 10px;
            border-radius: 4px; font-weight: bold; font-size: 11px; cursor: pointer;
        }
        .btn-buy:active { transform: scale(0.95); }
        .btn-bought { background: #7f8c8d !important; cursor: not-allowed; }
        .btn-close { background: #e74c3c; color: #fff; border: none; padding: 8px; border-radius: 6px; font-weight: bold; margin-top: 5px; cursor: pointer; }
        
        #game-msg {
            position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.85); padding: 20px; border-radius: 10px;
            font-size: 22px; font-weight: bold; color: #e74c3c; display: none; z-index: 200; text-align: center;
        }
    </style>
</head>
<body>

    <div id="top-ui">
        <div class="ui-group">
            <div>🚩 R<span id="round">1</span></div>
            <div>💰 <span id="gold">0</span>G</div>
        </div>
        <div class="ui-group">
            <span>👤</span>
            <div class="hp-bar-container">
                <div class="hp-bar-fill hp-player" id="playerHpBar"></div>
                <div class="hp-bar-text" id="playerHpText">200 / 200</div>
            </div>
            <span>🏰</span>
            <div class="hp-bar-container">
                <div class="hp-bar-fill hp-tower" id="towerHpBar"></div>
                <div class="hp-bar-text" id="towerHpText">1500 / 1500</div>
            </div>
        </div>
    </div>

    <canvas id="gameCanvas"></canvas>
    <div id="game-msg">게임 오버!</div>

    <div id="menu-overlay">
        <button class="btn-ui btn-stat" id="btnOpenStat">스탯</button>
        <button class="btn-ui btn-shop" id="btnOpenShop">상점</button>
    </div>

    <div id="controls-overlay">
        <button class="btn-ui" id="btnQ">Q<span class="btn-skill-cd" id="cdQ">READY</span></button>
        <button class="btn-ui" id="btnW">W<span class="btn-skill-cd" id="cdW">READY</span></button>
        <button class="btn-ui" id="btnE">E<span class="btn-skill-cd" id="cdE">READY</span></button>
    </div>

    <!-- 스탯 모달 -->
    <div class="modal" id="modalStat">
        <div class="modal-title">챔피언 스탯</div>
        <div class="modal-content" id="statContent"></div>
        <button class="btn-close" onclick="closeModal('modalStat')">닫기</button>
    </div>

    <!-- 상점 모달 -->
    <div class="modal" id="modalShop">
        <div class="modal-title">아이템 상점</div>
        <div class="modal-content" id="shopContent">
            <!-- JS dynamic render -->
        </div>
        <button class="btn-close" onclick="closeModal('modalShop')">닫기</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        const canvasWidth = Math.min(window.innerWidth, 480);
        const canvasHeight = Math.min(window.innerHeight - 36, 640);
        canvas.width = canvasWidth;
        canvas.height = canvasHeight;

        const midLineY = canvasHeight * 0.45;

        let gold = 0;
        let round = 1;
        let isGameOver = false;

        // 플레이어 데이터
        const player = {
            x: canvasWidth / 2, y: canvasHeight - 120,
            targetX: canvasWidth / 2, targetY: canvasHeight - 120,
            radius: 18, moveSpeed: 3.8,
            hp: 200, maxHp: 200,
            attackPower: 30, attackBaseCooldown: 15, attackCooldown: 0,
            attackRange: 170,
            qBuffTimer: 0, qCooldown: 0,
            wBuffTimer: 0, wCooldown: 0,
            eCooldown: 0, eEffectTimer: 0,
            lifesteal: 0 // 흡혈 스탯
        };

        // 아군 타워
        const tower = {
            x: canvasWidth / 2, y: canvasHeight - 40,
            radius: 30, hp: 1500, maxHp: 1500
        };

        // 📈 기본 스탯 강화 데이터 (구매 시 증가)
        const statUpgrades = {
            atk: { level: 0, basePrice: 50, priceMult: 1.4, statAdd: 10 },
            spd: { level: 0, basePrice: 70, priceMult: 1.5 }
        };

        // ⚔️ 완제품 아이템 데이터 (1회만 구매 가능)
        const equipmentItems = [
            {
                id: 'doran', name: '🗡️ 도란의 검', desc: '공격력 +15, 최대 체력 +40', price: 150, bought: false,
                apply: () => { player.attackPower += 15; player.maxHp += 40; player.hp += 40; }
            },
            {
                id: 'boots', name: '👟 광전사의 신발', desc: '이동속도 +0.8, 공격속도 +15%', price: 220, bought: false,
                apply: () => { player.moveSpeed += 0.8; player.attackBaseCooldown = Math.max(3, Math.floor(player.attackBaseCooldown * 0.85)); }
            },
            {
                id: 'vamp', name: '🩸 흡혈의 낫', desc: '타격 시 체력 +4 회복', price: 280, bought: false,
                apply: () => { player.lifesteal += 4; }
            },
            {
                id: 'warmog', name: '🛡️ 워모그의 갑옷', desc: '체력 +150 & 타워 체력 +300 회복', price: 350, bought: false,
                apply: () => { 
                    player.maxHp += 150; player.hp += 150;
                    tower.maxHp += 300; tower.hp = Math.min(tower.maxHp, tower.hp + 300);
                }
            }
        ];

        let minions = [];
        let projectiles = [];
        let floatingTexts = [];

        function updateUI() {
            document.getElementById('gold').innerText = gold;
            document.getElementById('round').innerText = round;

            const pPercent = Math.max(0, (player.hp / player.maxHp) * 100);
            document.getElementById('playerHpBar').style.width = pPercent + '%';
            document.getElementById('playerHpText').innerText = `${Math.ceil(Math.max(0, player.hp))} / ${player.maxHp}`;

            const tPercent = Math.max(0, (tower.hp / tower.maxHp) * 100);
            document.getElementById('towerHpBar').style.width = tPercent + '%';
            document.getElementById('towerHpText').innerText = `${Math.ceil(Math.max(0, tower.hp))} / ${tower.maxHp}`;

            // 스킬 쿨타임 UI 갱신
            document.getElementById('cdQ').innerText = player.qCooldown > 0 ? `${Math.ceil(player.qCooldown / 60)}s` : 'READY';
            document.getElementById('cdW').innerText = player.wCooldown > 0 ? `${Math.ceil(player.wCooldown / 60)}s` : 'READY';
            document.getElementById('cdE').innerText = player.eCooldown > 0 ? `${Math.ceil(player.eCooldown / 60)}s` : 'READY';
        }

        // 🛒 상점 UI 실시간 렌더링
        function renderShop() {
            const atkPrice = Math.floor(statUpgrades.atk.basePrice * Math.pow(statUpgrades.atk.priceMult, statUpgrades.atk.level));
            const spdPrice = Math.floor(statUpgrades.spd.basePrice * Math.pow(statUpgrades.spd.priceMult, statUpgrades.spd.level));

            let html = `
                <div class="shop-section-title">⚡ 기본 스탯 강화 (구매 시 가격 상승)</div>
                <div class="shop-item">
                    <div><b>공격력 +10</b> (Lv.${statUpgrades.atk.level})<br><small style="color:#aaa">가격: ${atkPrice} Gold</small></div>
                    <button class="btn-buy" onclick="buyStatUpgrade('atk')">구매</button>
                </div>
                <div class="shop-item">
                    <div><b>공격속도 +10%</b> (Lv.${statUpgrades.spd.level})<br><small style="color:#aaa">가격: ${spdPrice} Gold</small></div>
                    <button class="btn-buy" onclick="buyStatUpgrade('spd')">구매</button>
                </div>

                <div class="shop-section-title">🗡️ 완제품 장비 (1개씩만 구매 가능)</div>
            `;

            equipmentItems.forEach((item, idx) => {
                html += `
                    <div class="shop-item">
                        <div><b>${item.name}</b><br><small style="color:#aaa">${item.desc} / ${item.price}G</small></div>
                        ${item.bought 
                            ? `<button class="btn-buy btn-bought" disabled>구매 완료</button>`
                            : `<button class="btn-buy" onclick="buyEquipment(${idx})">구매</button>`}
                    </div>
                `;
            });

            html += `
                <div class="shop-section-title">🧪 소모품 회복</div>
                <div class="shop-item">
                    <div><b>플레이어 체력 +60 회복</b><br><small style="color:#aaa">가격: 35 Gold</small></div>
                    <button class="btn-buy" onclick="buyConsumable('healPlayer')">구매</button>
                </div>
                <div class="shop-item">
                    <div><b>타워 체력 +350 회복</b><br><small style="color:#aaa">가격: 45 Gold</small></div>
                    <button class="btn-buy" onclick="buyConsumable('healTower')">구매</button>
                </div>
            `;

            document.getElementById('shopContent').innerHTML = html;
        }

        // 기본 스탯 강화 구매
        function buyStatUpgrade(type) {
            if (type === 'atk') {
                const price = Math.floor(statUpgrades.atk.basePrice * Math.pow(statUpgrades.atk.priceMult, statUpgrades.atk.level));
                if (gold >= price) {
                    gold -= price;
                    player.attackPower += 10;
                    statUpgrades.atk.level++;
                } else return alert("골드가 부족합니다!");
            } else if (type === 'spd') {
                const price = Math.floor(statUpgrades.spd.basePrice * Math.pow(statUpgrades.spd.priceMult, statUpgrades.spd.level));
                if (gold >= price) {
                    gold -= price;
                    player.attackBaseCooldown = Math.max(3, Math.floor(player.attackBaseCooldown * 0.9));
                    statUpgrades.spd.level++;
                } else return alert("골드가 부족합니다!");
            }
            updateUI();
            renderShop();
        }

        // 완제품 장비 구매
        function buyEquipment(idx) {
            const item = equipmentItems[idx];
            if (item.bought) return;
            if (gold >= item.price) {
                gold -= item.price;
                item.bought = true;
                item.apply();
                updateUI();
                renderShop();
            } else {
                alert("골드가 부족합니다!");
            }
        }

        // 회복 소모품 구매
        function buyConsumable(type) {
            if (type === 'healPlayer' && gold >= 35) {
                gold -= 35;
                player.hp = Math.min(player.maxHp, player.hp + 60);
            } else if (type === 'healTower' && gold >= 45) {
                gold -= 45;
                tower.hp = Math.min(tower.maxHp, tower.hp + 350);
            } else {
                return alert("골드가 부족합니다!");
            }
            updateUI();
            renderShop();
        }

        canvas.addEventListener('pointerdown', (e) => {
            if (isGameOver) return;
            const rect = canvas.getBoundingClientRect();
            player.targetX = e.clientX - rect.left;
            player.targetY = e.clientY - rect.top;
        });

        // 🎯 Q 스킬: 속사 (연사 버프)
        document.getElementById('btnQ').addEventListener('pointerdown', (e) => {
            e.stopPropagation();
            if (player.qCooldown > 0 || isGameOver) return;
            player.qBuffTimer = 180; // 3초 지속
            player.qCooldown = 360;  // 6초 쿨타임
        });

        // ⚡ W 스킬: 신속 (이동속도 대폭 증가)
        document.getElementById('btnW').addEventListener('pointerdown', (e) => {
            e.stopPropagation();
            if (player.wCooldown > 0 || isGameOver) return;
            player.wBuffTimer = 150; // 2.5초 지속
            player.wCooldown = 420;  // 7초 쿨타임
        });

        // 💥 E 스킬: 충격파 (주변 광역 타격)
        document.getElementById('btnE').addEventListener('pointerdown', (e) => {
            e.stopPropagation();
            if (player.eCooldown > 0 || isGameOver) return;
            player.eEffectTimer = 20;
            player.eCooldown = 500;  // 8.3초 쿨타임

            minions.forEach(m => {
                const dist = Math.hypot(m.x - player.x, m.y - player.y);
                if (dist <= 160) { // 범위 내 적 피해
                    const dmg = player.attackPower * 2.5;
                    m.hp -= dmg;
                    floatingTexts.push(new FloatingText(`-${Math.floor(dmg)}`, m.x, m.y - 15, '#f1c40f'));
                }
            });
        });

        document.getElementById('btnOpenStat').addEventListener('pointerdown', (e) => {
            e.stopPropagation();
            document.getElementById('statContent').innerHTML = `
                • 체력: <b>${player.hp} / ${player.maxHp}</b><br>
                • 공격력: <b>${player.attackPower}</b><br>
                • 기본 공속: <b>초당 ${(60 / player.attackBaseCooldown).toFixed(1)}회</b><br>
                • 이동 속도: <b>${player.moveSpeed.toFixed(1)}</b><br>
                • 흡혈 효과: <b>타격당 +${player.lifesteal} HP</b>
            `;
            document.getElementById('modalStat').style.display = 'flex';
        });

        document.getElementById('btnOpenShop').addEventListener('pointerdown', (e) => {
            e.stopPropagation();
            renderShop();
            document.getElementById('modalShop').style.display = 'flex';
        });

        function closeModal(id) { document.getElementById(id).style.display = 'none'; }

        class FloatingText {
            constructor(text, x, y, color = '#ffda79') {
                this.text = text; this.x = x + (Math.random() - 0.5) * 15;
                this.y = y; this.color = color; this.alpha = 1;
            }
            update() { this.y -= 1.2; this.alpha -= 1 / 30; }
            draw() {
                ctx.save(); ctx.globalAlpha = Math.max(0, this.alpha);
                ctx.font = 'bold 13px Arial'; ctx.fillStyle = this.color;
                ctx.fillText(this.text, this.x, this.y); ctx.restore();
            }
        }

        let isWaveActive = false;

        function startNextWave() {
            isWaveActive = true;
            let enemyCount = 5 + round * 2;
            let spawned = 0;

            const spawnInterval = setInterval(() => {
                if (isGameOver) { clearInterval(spawnInterval); return; }

                const isChaser = Math.random() < 0.35;

                minions.push({
                    x: Math.random() * (canvasWidth - 80) + 40,
                    y: -20,
                    radius: isChaser ? 15 : 13,
                    speed: 0.9 + round * 0.1,
                    hp: 100 + round * 35,
                    maxHp: 100 + round * 35,
                    isChaser: isChaser,
                    isBoss: false,
                    attackPower: Math.floor(player.attackPower * 0.5),
                    attackCooldown: 0,
                    attackRate: 90
                });
                spawned++;

                if (spawned >= enemyCount) {
                    clearInterval(spawnInterval);
                    setTimeout(() => {
                        minions.push({
                            x: canvasWidth / 2, y: -30, radius: 24,
                            speed: 0.5 + round * 0.05,
                            hp: 450 + round * 320, maxHp: 450 + round * 320,
                            isChaser: false, isBoss: true,
                            attackPower: 30, attackCooldown: 0, attackRate: 60
                        });
                    }, 1000);
                }
            }, 600);
        }

        function gameLoop() {
            if (isGameOver) return;
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 라인 구분선
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.08)';
            ctx.setLineDash([5, 5]);
            ctx.beginPath(); ctx.moveTo(0, midLineY); ctx.lineTo(canvasWidth, midLineY); ctx.stroke();
            ctx.setLineDash([]);

            if (!isWaveActive && minions.length === 0) startNextWave();

            // 스킬 쿨타임 감쇠
            if (player.qCooldown > 0) player.qCooldown--;
            if (player.wCooldown > 0) player.wCooldown--;
            if (player.eCooldown > 0) player.eCooldown--;
            updateUI();

            // W 버프 처리 (속도 증가)
            let currentSpeed = player.moveSpeed;
            if (player.wBuffTimer > 0) {
                currentSpeed *= 1.8;
                player.wBuffTimer--;
            }

            // 플레이어 이동
            const dx = player.targetX - player.x;
            const dy = player.targetY - player.y;
            const dist = Math.hypot(dx, dy);
            if (dist > 2) {
                player.x += (dx / dist) * currentSpeed;
                player.y += (dy / dist) * currentSpeed;
            }
            player.x = Math.max(player.radius, Math.min(canvasWidth - player.radius, player.x));
            player.y = Math.max(player.radius + 40, Math.min(canvasHeight - player.radius - 50, player.y));

            // Q 버프 처리 (공속 대폭 증가)
            let currentCooldown = player.attackBaseCooldown;
            if (player.qBuffTimer > 0) {
                currentCooldown = Math.max(1, Math.floor(player.attackBaseCooldown * 0.1));
                player.qBuffTimer--;
                ctx.strokeStyle = `rgba(243, 156, 18, ${Math.abs(Math.sin(player.qBuffTimer * 0.1))})`;
                ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(player.x, player.y, player.radius + 6, 0, Math.PI * 2); ctx.stroke();
            }

            // E 이펙트 (광역 폭발 시각 효과)
            if (player.eEffectTimer > 0) {
                player.eEffectTimer--;
                ctx.fillStyle = `rgba(241, 196, 15, ${player.eEffectTimer / 20 * 0.4})`;
                ctx.beginPath(); ctx.arc(player.x, player.y, 160, 0, Math.PI * 2); ctx.fill();
            }

            // 플레이어 그리기
            ctx.fillStyle = player.wBuffTimer > 0 ? '#9b59b6' : '#3498db';
            ctx.beginPath(); ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2); ctx.fill();
            ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();

            // 자동 공격
            if (player.attackCooldown > 0) player.attackCooldown--;
            if (player.attackCooldown === 0) {
                let target = null;
                let minDist = player.attackRange;

                minions.forEach(m => {
                    const distToM = Math.hypot(m.x - player.x, m.y - player.y);
                    if (distToM < minDist) { minDist = distToM; target = m; }
                });

                if (target) {
                    projectiles.push({
                        x: player.x, y: player.y, target: target, speed: 12,
                        damage: player.attackPower,
                        color: player.qBuffTimer > 0 ? '#f1c40f' : '#2ecc71', radius: 5
                    });
                    player.attackCooldown = currentCooldown;
                }
            }

            // 아군 타워
            ctx.fillStyle = '#e74c3c'; ctx.beginPath(); ctx.arc(tower.x, tower.y, tower.radius, 0, Math.PI * 2); ctx.fill();

            // 몬스터
            for (let i = minions.length - 1; i >= 0; i--) {
                const m = minions[i];
                if (m.attackCooldown > 0) m.attackCooldown--;

                if (m.isChaser) {
                    const distToPlayer = Math.hypot(player.x - m.x, player.y - m.y);
                    if (distToPlayer > player.radius + m.radius) {
                        m.x += ((player.x - m.x) / distToPlayer) * m.speed;
                        m.y += ((player.y - m.y) / distToPlayer) * m.speed;
                    } else if (m.attackCooldown === 0) {
                        player.hp -= m.attackPower;
                        m.attackCooldown = m.attackRate;
                        floatingTexts.push(new FloatingText(`-${m.attackPower}`, player.x, player.y - 15, '#e74c3c'));
                        updateUI();

                        if (player.hp <= 0) {
                            isGameOver = true;
                            document.getElementById('game-msg').innerText = "플레이어 사망! 게임 오버";
                            document.getElementById('game-msg').style.display = 'block';
                            return;
                        }
                    }
                } else {
                    if (m.y < midLineY) {
                        m.y += m.speed;
                    } else {
                        const distToTower = Math.hypot(tower.x - m.x, tower.y - m.y);
                        if (distToTower > tower.radius + m.radius) {
                            m.x += ((tower.x - m.x) / distToTower) * m.speed;
                            m.y += ((tower.y - m.y) / distToTower) * m.speed;
                        } else if (m.attackCooldown === 0) {
                            tower.hp -= m.isBoss ? 40 : 15;
                            m.attackCooldown = m.attackRate;
                            floatingTexts.push(new FloatingText(`-${m.isBoss ? 40 : 15}`, tower.x, tower.y - 20, '#e74c3c'));
                            updateUI();

                            if (tower.hp <= 0) {
                                isGameOver = true;
                                document.getElementById('game-msg').innerText = "타워 파괴! 게임 오버";
                                document.getElementById('game-msg').style.display = 'block';
                                return;
                            }
                        }
                    }
                }

                if (m.isBoss) ctx.fillStyle = '#8e44ad';
                else if (m.isChaser) ctx.fillStyle = '#e67e22';
                else ctx.fillStyle = '#e74c3c';

                ctx.beginPath(); ctx.arc(m.x, m.y, m.radius, 0, Math.PI * 2); ctx.fill();
                ctx.strokeStyle = '#fff'; ctx.lineWidth = 1; ctx.stroke();

                const barWidth = m.radius * 2.2;
                ctx.fillStyle = '#333'; ctx.fillRect(m.x - barWidth/2, m.y - m.radius - 10, barWidth, 4);
                ctx.fillStyle = '#2ecc71'; ctx.fillRect(m.x - barWidth/2, m.y - m.radius - 10, (m.hp / m.maxHp) * barWidth, 4);
                ctx.fillStyle = '#fff'; ctx.font = '9px Arial'; ctx.textAlign = 'center';
                ctx.fillText(`${Math.ceil(m.hp)}`, m.x, m.y - m.radius - 13);

                if (m.hp <= 0) {
                    gold += m.isBoss ? 100 : (m.isChaser ? 25 : 15);
                    updateUI();
                    minions.splice(i, 1);

                    if (minions.length === 0) {
                        isWaveActive = false;
                        round++;
                        updateUI();
                    }
                }
            }

            // 투사체 및 흡혈 연출
            for (let i = projectiles.length - 1; i >= 0; i--) {
                const p = projectiles[i];
                if (!p.target || p.target.hp <= 0) { projectiles.splice(i, 1); continue; }

                const dx = p.target.x - p.x;
                const dy = p.target.y - p.y;
                const dist = Math.hypot(dx, dy);

                if (dist < p.speed) {
                    p.target.hp -= p.damage;
                    floatingTexts.push(new FloatingText(`-${p.damage}`, p.target.x, p.target.y - 10, p.color));

                    // 🩸 흡혈 효과 적용
                    if (player.lifesteal > 0 && player.hp < player.maxHp) {
                        player.hp = Math.min(player.maxHp, player.hp + player.lifesteal);
                        floatingTexts.push(new FloatingText(`+${player.lifesteal}`, player.x, player.y - 15, '#2ecc71'));
                        updateUI();
                    }

                    projectiles.splice(i, 1);
                } else {
                    p.x += (dx / dist) * p.speed;
                    p.y += (dy / dist) * p.speed;
                    ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2); ctx.fill();
                }
            }

            for (let i = floatingTexts.length - 1; i >= 0; i--) {
                floatingTexts[i].update();
                floatingTexts[i].draw();
                if (floatingTexts[i].alpha <= 0) floatingTexts.splice(i, 1);
            }

            requestAnimationFrame(gameLoop);
        }

        updateUI();
        gameLoop();
    </script>
</body>
</html>
