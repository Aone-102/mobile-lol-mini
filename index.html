<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>랜덤 다이스 디펜스 Mini</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #12131C;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        #top-ui {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 420px;
            padding: 10px 16px;
            background: #1D1F2C;
            border-bottom: 2px solid #2A2D3D;
            position: fixed;
            top: 0;
            z-index: 10;
        }
        .stat-box { font-size: 14px; font-weight: bold; }
        .hp-text { color: #FF4757; }
        .sp-text { color: #2ED573; }
        .wave-text { color: #FFA502; }

        canvas {
            background-color: #181924;
            box-shadow: 0 8px 24px rgba(0,0,0,0.6);
            margin-top: 50px;
            margin-bottom: 70px;
            border-radius: 8px;
        }

        #bottom-ui {
            position: fixed;
            bottom: 10px;
            width: 100%;
            max-width: 420px;
            display: flex;
            justify-content: center;
            padding: 0 10px;
            z-index: 10;
        }
        .btn-spawn {
            width: 100%;
            height: 50px;
            background: linear-gradient(135deg, #2ED573, #1E90FF);
            border: none;
            border-radius: 12px;
            color: #fff;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(46, 213, 115, 0.3);
        }
        .btn-spawn:active { transform: scale(0.97); }

        #game-msg {
            position: absolute;
            top: 45%; left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.9);
            padding: 25px 35px;
            border-radius: 16px;
            font-size: 24px;
            font-weight: bold;
            color: #FF4757;
            display: none;
            z-index: 100;
            text-align: center;
            border: 2px solid #FF4757;
        }
    </style>
</head>
<body>

    <div id="top-ui">
        <div class="stat-box hp-text">❤️ HP: <span id="hp">3</span></div>
        <div class="stat-box wave-text">🌊 WAVE <span id="wave">1</span></div>
        <div class="stat-box sp-text">💎 SP: <span id="sp">100</span></div>
    </div>

    <canvas id="gameCanvas"></canvas>
    <div id="game-msg">GAME OVER</div>

    <div id="bottom-ui">
        <button class="btn-spawn" id="btnSpawn">🎲 주사위 소환 (<span id="spawnCost">10</span> SP)</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        const width = Math.min(window.innerWidth - 20, 400);
        const height = Math.min(window.innerHeight - 130, 560);
        canvas.width = width;
        canvas.height = height;

        // 게임 설정 변수
        let hp = 3;
        let wave = 1;
        let sp = 100;
        let spawnCost = 10;
        let isGameOver = false;

        // 주사위 속성 정의 (종류별 색상 및 공격 특성)
        const DICE_TYPES = [
            { type: 'fire', color: '#FF4757', name: '화염' },
            { type: 'ice', color: '#1E90FF', name: '얼음' },
            { type: 'wind', color: '#2ED573', name: '바람' },
            { type: 'electric', color: '#FFA502', name: '전기' },
            { type: 'poison', color: '#9B59B6', name: '독' }
        ];

        // 타일 및 보드 설정 (3x3 그리드)
        const gridRows = 3;
        const gridCols = 3;
        const tileSize = Math.floor((width - 60) / 3);
        const boardX = (width - (tileSize * gridCols)) / 2;
        const boardY = height - (tileSize * gridRows) - 20;

        let board = Array(gridRows * gridCols).fill(null);

        // 트랙 동선 (상단 트랙 순환)
        const trackMargin = 20;
        const trackWidth = width - trackMargin * 2;
        const trackHeight = boardY - 40;
        const waypoints = [
            { x: trackMargin, y: trackMargin },
            { x: trackMargin + trackWidth, y: trackMargin },
            { x: trackMargin + trackWidth, y: trackMargin + trackHeight },
            { x: trackMargin, y: trackMargin + trackHeight }
        ];

        let monsters = [];
        let projectiles = [];
        let floatingTexts = [];

        // 드래그 앤 드롭 변수
        let draggedIndex = null;
        let dragX = 0, dragY = 0;

        // --- UI 및 리셋 ---
        function updateUI() {
            document.getElementById('hp').innerText = hp;
            document.getElementById('wave').innerText = wave;
            document.getElementById('sp').innerText = sp;
            document.getElementById('spawnCost').innerText = spawnCost;
        }

        // --- 주사위 소환 & 합성 ---
        function spawnDice() {
            if (sp < spawnCost || isGameOver) return;

            let emptySlots = [];
            board.forEach((slot, idx) => { if (slot === null) emptySlots.push(idx); });

            if (emptySlots.length === 0) return; // 자리가 없음

            sp -= spawnCost;
            spawnCost += 10; // 소환할 때마다 SP 비용 증가

            const randomSlot = emptySlots[Math.floor(Math.random() * emptySlots.length)];
            const randomType = DICE_TYPES[Math.floor(Math.random() * DICE_TYPES.length)];

            board[randomSlot] = {
                type: randomType.type,
                color: randomType.color,
                dot: 1,
                attackCooldown: 0
            };

            updateUI();
        }

        document.getElementById('btnSpawn').addEventListener('click', spawnDice);

        // --- 드래그 조작 (드래그 앤 드롭으로 주사위 합치기) ---
        function getSlotIndexAt(x, y) {
            for (let r = 0; r < gridRows; r++) {
                for (let c = 0; c < gridCols; c++) {
                    const sx = boardX + c * tileSize;
                    const sy = boardY + r * tileSize;
                    if (x >= sx && x <= sx + tileSize && y >= sy && y <= sy + tileSize) {
                        return r * gridCols + c;
                    }
                }
            }
            return null;
        }

        canvas.addEventListener('pointerdown', (e) => {
            if (isGameOver) return;
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            const idx = getSlotIndexAt(x, y);
            if (idx !== null && board[idx] !== null) {
                draggedIndex = idx;
                dragX = x;
                dragY = y;
            }
        });

        canvas.addEventListener('pointermove', (e) => {
            if (draggedIndex === null) return;
            const rect = canvas.getBoundingClientRect();
            dragX = e.clientX - rect.left;
            dragY = e.clientY - rect.top;
        });

        canvas.addEventListener('pointerup', (e) => {
            if (draggedIndex === null) return;
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            const targetIdx = getSlotIndexAt(x, y);

            // 동일 조건일 때 합치기 (같은 위치 X, 같은 주사위 종류 X -> 동일 눈금일 경우 랜덤 변환)
            if (targetIdx !== null && targetIdx !== draggedIndex && board[targetIdx] !== null) {
                const src = board[draggedIndex];
                const dst = board[targetIdx];

                if (src.dot === dst.dot) {
                    const randomType = DICE_TYPES[Math.floor(Math.random() * DICE_TYPES.length)];
                    board[targetIdx] = {
                        type: randomType.type,
                        color: randomType.color,
                        dot: src.dot + 1, // 눈금 1 증가
                        attackCooldown: 0
                    };
                    board[draggedIndex] = null;
                }
            }

            draggedIndex = null;
        });

        // --- 웨이브 & 몬스터 웨이브 관리 ---
        let spawnTimer = 0;
        let spawnedInWave = 0;
        const maxWaveMonsters = 10;

        function updateWave() {
            spawnTimer++;
            if (spawnTimer >= 90 && spawnedInWave < maxWaveMonsters) { // 1.5초마다 몬스터 스폰
                spawnTimer = 0;
                monsters.push({
                    x: waypoints[0].x,
                    y: waypoints[0].y,
                    targetWaypoint: 1,
                    hp: 50 + wave * 45,
                    maxHp: 50 + wave * 45,
                    speed: 1.2 + wave * 0.1,
                    radius: 12
                });
                spawnedInWave++;
            }

            if (spawnedInWave >= maxWaveMonsters && monsters.length === 0) {
                wave++;
                spawnedInWave = 0;
                sp += 50; // 웨이브 클리어 보상
                updateUI();
            }
        }

        // --- Floating Text ---
        class FloatingText {
            constructor(text, x, y, color) {
                this.text = text; this.x = x; this.y = y;
                this.color = color; this.alpha = 1;
            }
            update() { this.y -= 0.8; this.alpha -= 0.03; }
            draw() {
                ctx.save(); ctx.globalAlpha = Math.max(0, this.alpha);
                ctx.fillStyle = this.color; ctx.font = 'bold 12px Arial';
                ctx.fillText(this.text, this.x, this.y); ctx.restore();
            }
        }

        // --- 메인 게임 루프 ---
        function gameLoop() {
            if (isGameOver) return;
            ctx.clearRect(0, 0, width, height);

            updateWave();

            // 1. 트랙 그리기
            ctx.strokeStyle = '#2A2D3D';
            ctx.lineWidth = 20;
            ctx.lineJoin = 'round';
            ctx.beginPath();
            ctx.moveTo(waypoints[0].x, waypoints[0].y);
            waypoints.forEach(wp => ctx.lineTo(wp.x, wp.y));
            ctx.closePath();
            ctx.stroke();

            // 2. 보드 및 주사위 그리기
            for (let r = 0; r < gridRows; r++) {
                for (let c = 0; c < gridCols; c++) {
                    const idx = r * gridCols + c;
                    const sx = boardX + c * tileSize;
                    const sy = boardY + r * tileSize;

                    // 타일 배경
                    ctx.fillStyle = '#1D1F2C';
                    ctx.fillRect(sx + 3, sy + 3, tileSize - 6, tileSize - 6);
                    ctx.strokeStyle = '#2A2D3D';
                    ctx.lineWidth = 2;
                    ctx.strokeRect(sx + 3, sy + 3, tileSize - 6, tileSize - 6);

                    // 주사위 그리기
                    const dice = board[idx];
                    if (dice && idx !== draggedIndex) {
                        drawDice(sx + tileSize / 2, sy + tileSize / 2, dice);
                    }
                }
            }

            // 드래그 중인 주사위 그리기
            if (draggedIndex !== null && board[draggedIndex]) {
                drawDice(dragX, dragY, board[draggedIndex]);
            }

            // 3. 몬스터 이동 및 처리
            for (let i = monsters.length - 1; i >= 0; i--) {
                const m = monsters[i];
                const target = waypoints[m.targetWaypoint];

                const dx = target.x - m.x;
                const dy = target.y - m.y;
                const dist = Math.hypot(dx, dy);

                if (dist < m.speed) {
                    m.targetWaypoint = (m.targetWaypoint + 1) % waypoints.length;
                    // 한 바퀴 완전히 돈 경우 (목적지 도달 -> HP 차감)
                    if (m.targetWaypoint === 1) {
                        hp--;
                        updateUI();
                        monsters.splice(i, 1);
                        if (hp <= 0) {
                            isGameOver = true;
                            document.getElementById('game-msg').style.display = 'block';
                            return;
                        }
                        continue;
                    }
                } else {
                    m.x += (dx / dist) * m.speed;
                    m.y += (dy / dist) * m.speed;
                }

                // 몬스터 그리기
                ctx.fillStyle = '#FF4757';
                ctx.beginPath(); ctx.arc(m.x, m.y, m.radius, 0, Math.PI * 2); ctx.fill();

                // 몬스터 체력바
                ctx.fillStyle = '#333'; ctx.fillRect(m.x - 12, m.y - 18, 24, 4);
                ctx.fillStyle = '#2ED573'; ctx.fillRect(m.x - 12, m.y - 18, (m.hp / m.maxHp) * 24, 4);
            }

            // 4. 주사위 공격 로직
            board.forEach((dice, idx) => {
                if (!dice) return;

                const r = Math.floor(idx / gridCols);
                const c = idx % gridCols;
                const sx = boardX + c * tileSize + tileSize / 2;
                const sy = boardY + r * tileSize + tileSize / 2;

                if (dice.attackCooldown > 0) dice.attackCooldown--;

                if (dice.attackCooldown <= 0 && monsters.length > 0) {
                    // 가장 앞에 있는 몬스터 타겟팅
                    const target = monsters[0];
                    projectiles.push({
                        x: sx, y: sy, target: target,
                        speed: 7,
                        damage: dice.dot * 15,
                        color: dice.color
                    });
                    // 공격 속도: 눈금수가 높을수록 소폭 증가
                    dice.attackCooldown = Math.max(15, 45 - dice.dot * 3);
                }
            });

            // 5. 투사체 이동 및 충돌
            for (let i = projectiles.length - 1; i >= 0; i--) {
                const p = projectiles[i];
                if (!p.target || p.target.hp <= 0) { projectiles.splice(i, 1); continue; }

                const dx = p.target.x - p.x;
                const dy = p.target.y - p.y;
                const dist = Math.hypot(dx, dy);

                if (dist < p.speed) {
                    p.target.hp -= p.damage;
                    floatingTexts.push(new FloatingText(`-${p.damage}`, p.target.x, p.target.y - 10, p.color));

                    if (p.target.hp <= 0) {
                        const mIdx = monsters.indexOf(p.target);
                        if (mIdx !== -1) {
                            monsters.splice(mIdx, 1);
                            sp += 10; // 몬스터 처치 SP
                            updateUI();
                        }
                    }
                    projectiles.splice(i, 1);
                } else {
                    p.x += (dx / dist) * p.speed;
                    p.y += (dy / dist) * p.speed;

                    ctx.fillStyle = p.color;
                    ctx.beginPath(); ctx.arc(p.x, p.y, 4, 0, Math.PI * 2); ctx.fill();
                }
            }

            // 6. Floating Text 그리기
            for (let i = floatingTexts.length - 1; i >= 0; i--) {
                floatingTexts[i].update();
                floatingTexts[i].draw();
                if (floatingTexts[i].alpha <= 0) floatingTexts.splice(i, 1);
            }

            requestAnimationFrame(gameLoop);
        }

        // --- 주사위(눈금) 그리기 함수 ---
        function drawDice(x, y, dice) {
            const size = tileSize - 16;
            ctx.fillStyle = dice.color;
            ctx.beginPath();
            ctx.roundRect(x - size / 2, y - size / 2, size, size, 10);
            ctx.fill();

            // 눈금(Dot) 형태 그리기
            ctx.fillStyle = '#FFF';
            const dotPositions = getDotPositions(dice.dot, x, y, size);
            dotPositions.forEach(p => {
                ctx.beginPath();
                ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
                ctx.fill();
            });
        }

        // 눈금 위치 계산
        function getDotPositions(dot, cx, cy, size) {
            const offset = size / 4;
            const res = [];
            if (dot % 2 === 1) res.push({ x: cx, y: cy }); // 중앙
            if (dot >= 2) { res.push({ x: cx - offset, y: cy - offset }); res.push({ x: cx + offset, y: cy + offset }); }
            if (dot >= 4) { res.push({ x: cx + offset, y: cy - offset }); res.push({ x: cx - offset, y: cy + offset }); }
            if (dot >= 6) { res.push({ x: cx - offset, y: cy }); res.push({ x: cx + offset, y: cy }); }
            return res;
        }

        updateUI();
        gameLoop();
    </script>
</body>
</html>
