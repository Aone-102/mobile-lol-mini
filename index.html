<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <title>모바일 LOL: 하이퍼 어택 Mini</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none; /* 브라우저 기본 터치 동작 방지 */
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #0b0e14;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        #top-ui {
            display: flex;
            justify-content: space-between;
            width: 100%;
            max-width: 480px;
            padding: 10px 15px;
            background-color: rgba(22, 26, 35, 0.8);
            backdrop-filter: blur(5px);
            font-size: 14px;
            font-weight: bold;
            border-bottom: 2px solid #333;
            position: fixed;
            top: 0;
            z-index: 10;
        }
        canvas {
            background-color: #12181b;
            box-shadow: 0 4px 20px rgba(0,0,0,0.8);
            margin-top: 45px; /* UI 높이만큼 */
        }
        #controls-overlay {
            position: absolute;
            bottom: 30px;
            right: 20px;
            display: flex;
            gap: 15px;
            z-index: 10;
        }
        .btn-skill {
            width: 65px;
            height: 65px;
            border-radius: 50%;
            border: 3px solid #f39c12;
            background: rgba(44, 62, 80, 0.9);
            color: #fff;
            font-weight: bold;
            font-size: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 8px rgba(0,0,0,0.5);
            transition: 0.1s;
        }
        .btn-skill:active {
            transform: scale(0.9);
            background: #d35400;
        }
        .btn-skill span {
            font-size: 10px;
            margin-top: 2px;
            color: #ddd;
        }
        /* 알림 메시지 */
        #game-msg {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.8);
            padding: 20px;
            border-radius: 10px;
            font-size: 20px;
            display: none;
            z-index: 100;
        }
    </style>
</head>
<body>

    <div id="top-ui">
        <div>💰 Gold: <span id="gold">0</span></div>
        <div>⚔️ CS: <span id="kills">0</span></div>
        <div>🏰 Tower: <span id="towerHp">1500</span></div>
    </div>

    <canvas id="gameCanvas"></canvas>
    
    <div id="game-msg">게임 오버!</div>

    <!-- 스킬 버튼 오버레이 (우하단 배치) -->
    <div id="controls-overlay">
        <button class="btn-skill" id="btnQ">Q<br><span>하이퍼어택</span></button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const uiTowerHp = document.getElementById('towerHp');
        const uiGold = document.getElementById('gold');
        const uiKills = document.getElementById('kills');
        const uiMsg = document.getElementById('game-msg');

        // 반응형 Canvas 크기 (모바일 최적화)
        const canvasWidth = Math.min(window.innerWidth, 480);
        const canvasHeight = Math.min(window.innerHeight - 50, 640);
        canvas.width = canvasWidth;
        canvas.height = canvasHeight;

        // 게임 상태
        let gold = 0;
        let kills = 0;
        let isGameOver = false;

        // 플레이어 (챔피언)
        const player = {
            x: canvasWidth / 2,
            y: canvasHeight - 120,
            targetX: canvasWidth / 2, // 이동 목표 위치
            targetY: canvasHeight - 120,
            radius: 18,
            baseSpeed: 3.5,
            hp: 800,
            maxHp: 800,
            attackRange: 160,
            attackBaseCooldown: 15, // 평타 기본 쿨타임 (낮을수록 빠름, 랜덤다이스 기본)
            attackCooldown: 0,
            qBuffTimer: 0 // Q스킬 하이퍼어택 지속시간
        };

        // 아군 타워 (넥서스 대용)
        const tower = {
            x: canvasWidth / 2,
            y: canvasHeight - 40,
            radius: 30,
            hp: 1500,
            maxHp: 1500,
            range: 200,
            cooldown: 0
        };

        // 객체 배열
        let minions = [];
        let projectiles = [];
        let particles = [];
        let clickEffects = [];

        // ==========================================
        // 새로운 조작: 화면 터치 지점으로 이동
        // ==========================================
        canvas.addEventListener('pointerdown', (e) => {
            if (isGameOver) return;
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            
            // 타겟 위치 업데이트
            player.targetX = x;
            player.targetY = y;

            // 클릭 이펙트 추가
            clickEffects.push({ x, y, life: 15, radius: 2 });
        });

        // ==========================================
        // 새로운 Q 스킬: 하이퍼 어택 (공속 95%)
        // ==========================================
        document.getElementById('btnQ').addEventListener('pointerdown', (e) => {
            e.stopPropagation(); // 캔버스 클릭 이벤트 전파 방지
            if (player.qBuffTimer > 0 || isGameOver) return;
            
            player.qBuffTimer = 180; // 약 3초 (60fps 기준)
            
            // 시각 효과
            for (let i = 0; i < 15; i++) {
                particles.push(new Particle(player.x, player.y, '#f39c12', 4, 30));
            }
        });

        // ==========================================
        // 유틸리티 클래스 (입자, 이펙트)
        // ==========================================
        class Particle {
            constructor(x, y, color, speed, life) {
                this.x = x; this.y = y; this.color = color;
                this.vx = (Math.random() - 0.5) * speed;
                this.vy = (Math.random() - 0.5) * speed;
                this.life = life; this.maxLife = life;
            }
            update() { this.x += this.vx; this.y += this.vy; this.life--; }
            draw() {
                ctx.globalAlpha = this.life / this.maxLife;
                ctx.fillStyle = this.color;
                ctx.beginPath(); ctx.arc(this.x, this.y, 2, 0, Math.PI * 2); ctx.fill();
                ctx.globalAlpha = 1;
            }
        }

        // ==========================================
        // 메인 게임 루프 및 스폰
        // ==========================================
        let spawnTimer = 0;
        let wave = 1;

        function spawnMinionWave() {
            for (let i = 0; i < 3 + wave; i++) {
                setTimeout(() => {
                    if (isGameOver) return;
                    minions.push({
                        x: Math.random() * (canvasWidth - 80) + 40,
                        y: -20, radius: 14, speed: 0.9 + wave * 0.1,
                        hp: 120 + wave * 30, maxHp: 120 + wave * 30,
                    });
                }, i * 400);
            }
            wave++;
        }

        function gameLoop() {
            if (isGameOver) return;
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 1. 라인 배경 그리기
            ctx.strokeStyle = '#1e2836'; ctx.lineWidth = 1;
            for (let i = 0; i < canvasWidth; i += 50) { ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, canvasHeight); ctx.stroke(); }
            for (let i = 0; i < canvasHeight; i += 50) { ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(canvasWidth, i); ctx.stroke(); }

            // 2. 미니언 스폰 (15초마다)
            spawnTimer++;
            if (spawnTimer % 900 === 0) spawnMinionWave();
            if (spawnTimer === 1) spawnMinionWave(); // 시작 시 첫 웨이브

            // 3. 플레이어 이동 로직
            const dx = player.targetX - player.x;
            const dy = player.targetY - player.y;
            const dist = Math.hypot(dx, dy);
            
            if (dist > 2) { // 목표 위치 근처까지 이동
                const speed = player.baseSpeed;
                player.x += (dx / dist) * speed;
                player.y += (dy / dist) * speed;
            }

            // 맵 경계 제한
            player.x = Math.max(player.radius, Math.min(canvasWidth - player.radius, player.x));
            player.y = Math.max(player.radius + 50, Math.min(canvasHeight - player.radius - 50, player.y));

            // 4. 플레이어 & Q버프 업데이트
            let currentAttackCooldown = player.attackBaseCooldown;
            if (player.qBuffTimer > 0) {
                // Q 하이퍼어택: 풀공속 95% (기존 쿨타임의 5%로 단축)
                currentAttackCooldown = Math.max(1, Math.floor(player.attackBaseCooldown * 0.05));
                player.qBuffTimer--;
                
                // Q 버프 비주얼 효과 (오라)
                ctx.strokeStyle = `rgba(243, 156, 18, ${Math.abs(Math.sin(player.qBuffTimer * 0.1))})`;
                ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(player.x, player.y, player.radius + 5, 0, Math.PI * 2); ctx.stroke();
            }

            // 플레이어 그리기 (블루 챔피언)
            ctx.fillStyle = '#3498db'; ctx.beginPath(); ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2); ctx.fill();
            ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();
            // 사거리 원 표시
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.1)'; ctx.lineWidth = 1; ctx.beginPath(); ctx.arc(player.x, player.y, player.attackRange, 0, Math.PI * 2); ctx.stroke();

            // 5. 플레이어 초고속 자동 공격 (사거리 내 가장 가까운 적)
            if (player.attackCooldown > 0) player.attackCooldown--;

            if (player.attackCooldown === 0) {
                let target = null;
                let minDist = player.attackRange;

                minions.forEach(m => {
                    const distToM = Math.hypot(m.x - player.x, m.y - player.y);
                    if (distToM < minDist) { minDist = distToM; target = m; }
                });

                if (target) {
                    // 평타 발사 (랜덤다이스 식)
                    projectiles.push({
                        x: player.x, y: player.y, target: target, speed: 12, damage: player.qBuffTimer > 0 ? 25 : 30, // Q버프 시 뎀감
                        color: player.qBuffTimer > 0 ? '#f1c40f' : '#2ecc71', radius: player.qBuffTimer > 0 ? 6 : 5
                    });
                    player.attackCooldown = currentAttackCooldown; // 0.05x 쿨타임 적용 (초고속)
                }
            }

            // 6. 타워 & 미니언 로직
            // 타워 (레드 넥서스)
            ctx.fillStyle = '#e74c3c'; ctx.beginPath(); ctx.arc(tower.x, tower.y, tower.radius, 0, Math.PI * 2); ctx.fill();
            ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();

            // 미니언 업데이트
            for (let i = minions.length - 1; i >= 0; i--) {
                const m = minions[i];
                const distToTower = Math.hypot(tower.x - m.x, tower.y - m.y);

                if (distToTower > tower.radius + 8) {
                    m.y += m.speed; // 타워(아래)를 향해 직선 이동
                } else {
                    tower.hp -= 0.6; // 타워 공격
                    uiTowerHp.innerText = Math.max(0, Math.floor(tower.hp));
                    if (tower.hp <= 0) {
                        isGameOver = true; uiMsg.style.display = 'block'; return;
                    }
                }

                // 미니언 그리기
                ctx.fillStyle = '#e74c3c'; ctx.beginPath(); ctx.arc(m.x, m.y, m.radius, 0, Math.PI * 2); ctx.fill();
                // 미니언 체력바
                ctx.fillStyle = '#333'; ctx.fillRect(m.x - 15, m.y - 22, 30, 4);
                ctx.fillStyle = '#2ecc71'; ctx.fillRect(m.x - 15, m.y - 22, (m.hp / m.maxHp) * 30, 4);

                if (m.hp <= 0) {
                    gold += 18; kills++; uiGold.innerText = gold; uiKills.innerText = kills;
                    for(let j=0; j<5; j++) particles.push(new Particle(m.x, m.y, '#e74c3c', 2, 20));
                    minions.splice(i, 1);
                }
            }

            // 7. 투사체 이동 및 충돌
            for (let i = projectiles.length - 1; i >= 0; i--) {
                const p = projectiles[i];
                if (!p.target || p.target.hp <= 0) { projectiles.splice(i, 1); continue; }

                const dx = p.target.x - p.x; const dy = p.target.y - p.y; const dist = Math.hypot(dx, dy);

                if (dist < p.speed) {
                    p.target.hp -= p.damage; projectiles.splice(i, 1);
                } else {
                    p.x += (dx / dist) * p.speed; p.y += (dy / dist) * p.speed;
                    ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2); ctx.fill();
                }
            }

            // 8. 파티클 & 클릭 이펙트
            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].update(); particles[i].draw();
                if (particles[i].life <= 0) particles.splice(i, 1);
            }
            for (let i = clickEffects.length - 1; i >= 0; i--) {
                const ce = clickEffects[i]; ce.life--; ce.radius += 1.5;
                ctx.strokeStyle = `rgba(52, 152, 219, ${ce.life / 15})`; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(ce.x, ce.y, ce.radius, 0, Math.PI * 2); ctx.stroke();
                if (ce.life <= 0) clickEffects.splice(i, 1);
            }

            requestAnimationFrame(gameLoop);
        }

        gameLoop();
    </script>
</body>
</html>
